###################################################################################################
# AMBIENTE DE HOMOLOGAÇÃO – BORURIO ERP FISCAL BR
# ________________________________________________________________________________________________
# Módulo: borurio-web (API REST principal)
# Integrações: MySQL, Redis, SEFAZ-SP (NF-e 4.00 Homologação Real)
# Stack: Spring Boot 3.3.x | Java 17 | UTF-8 sem BOM
# Autor: Bruno Ribeiro – Desenvolvedor Fullstack / DevSecOps
###################################################################################################

server:
  address: 0.0.0.0
  port: 8282
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

###################################################################################################
# SPRING – Configurações principais
###################################################################################################
spring:
  application:
    name: borurio-web-hom

  ################################################################################################
  # BANCO DE DADOS – MySQL 8.4 (Ambiente de Homologação Real)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:borurio-mysql-hom}:${DB_PORT:3306}/${DB_NAME:borurio_fiscal_hom}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:borurio}
    password: ${DB_PASS:H4ck3r123}
    hikari:
      pool-name: BorurioHomHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
      hibernate.show_sql: false

  ################################################################################################
  # REDIS – Cache e Sessões (Homologação)
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:borurio-redis-hom}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON – Serialização JSON (Formatação Padrão Brasileira)
  ################################################################################################
  jackson:
    serialization:
      indent_output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # SPRING CORE – Configurações Gerais e MVC
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**
  web:
    resources:
      add-mappings: true
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

###################################################################################################
# LOGGING – Auditoria e Rastreabilidade (via Logback)
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

###################################################################################################
# SEFAZ – Configuração Oficial NT 2025.002 (Homologação SP)
###################################################################################################
sefaz:
  ambiente: 2   # 1=Produção | 2=Homologação
  uf: SP
  timeout: 30s
  url-autorizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx
  url-retorno: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx
  url-consulta: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx
  url-status: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx
  url-inutilizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx
  url-cadastro: https://homologacao.nfe.fazenda.sp.gov.br/ws/CadConsultaCadastro4.asmx
  url-recepcaoevento: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRecepcaoEvento4.asmx
  cert-path: ${CERT_PATH:/app/certificados/certificado-homologacao.pfx}
  cert-pass: ${CERT_PASS:SUA_SENHA_DO_CERTIFICADO}

###################################################################################################
# BORURIO – Configurações Fiscais e Certificado Digital (Homologação Real)
###################################################################################################
borurio:
  sefaz:
    ambiente: HOMOLOGACAO
    tpAmb: 2
    uf: SP
    urlAutorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    urlRetAutorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    urlConsultaProtocolo: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    urlInutilizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx"
    urlStatusServico: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"
    urlConsultaCadastro: "https://homologacao.nfe.fazenda.sp.gov.br/ws/CadConsultaCadastro4.asmx"
    urlRecepcaoEvento: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRecepcaoEvento4.asmx"

  certificado:
    caminho: ${CERT_PATH:/app/certificados/certificado-homologacao.pfx}
    senha: ${CERT_PASS:SUA_SENHA_DO_CERTIFICADO}

###################################################################################################
# LEGADO DE COMPATIBILIDADE – Variáveis esperadas por NfeTransmitServiceImpl
###################################################################################################
nfe:
  sefaz:
    tpAmb: 2
    certificado: ${NFE_SEFAZ_CERTIFICADO:/app/certificados/certificado-homologacao.pfx}
    senha: ${NFE_SEFAZ_SENHA:SUA_SENHA_DO_CERTIFICADO}
    url-autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    url-retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    url-consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    url-status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"
    url-inutilizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx"

###################################################################################################
# FISCAL – Certificado Digital A1 (PFX) de Homologação Real
###################################################################################################
fiscal:
  cert:
    path: ${CERT_PATH:/app/certificados/certificado-homologacao.pfx}
    pass: ${CERT_PASS:SUA_SENHA_DO_CERTIFICADO}

###################################################################################################
# ACTUATOR – Monitoramento e Observabilidade
###################################################################################################
management:
  server:
    port: 8281
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,env,beans,loggers"
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# PERFIL ATIVO E METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: hom
  description: "Ambiente de Homologação Real SEFAZ-SP (tpAmb=2)"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"

###################################################################################################
# NOTAS TÉCNICAS
# ________________________________________________________________________________________________
# - Ambiente integrado Docker Compose (MySQL 3310 / Redis 6380 / MinIO / Mailpit)
# - Certificado A1 real de homologação
# - Porta interna 8282 (API Web) e 8281 (Actuator Health)
# - Banco isolado: borurio_fiscal_hom
# - Configuração alinhada ao container borurio-web-hom
# - spring.jpa.open-in-view=false já configurado para segurança transacional
# - DB_HOST, DB_USER, DB_PASS devem ser injetados via docker-compose.hom.yml
###################################################################################################
