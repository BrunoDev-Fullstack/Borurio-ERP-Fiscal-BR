###############################################################################################
# CONFIGURAÇÃO PRINCIPAL – BORURIO ERP FISCAL BR
# ---------------------------------------------------------------------------------------------
# Função:
#   Define parâmetros comuns e delega as configurações específicas para cada ambiente.
#
# Módulo:
#   borurio-web (API REST principal)
#
# Perfis disponíveis:
#   dev → Desenvolvimento local (Docker Compose DEV)
#   hom → Homologação (SEFAZ-SP tpAmb=2)
#   prd → Produção (SEFAZ-SP tpAmb=1)
#
# Stack:
#   Spring Boot 3.3.x | Java 17 | UTF-8 (sem BOM)
#
# Autor:
#   Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
###############################################################################################

spring:
  application:
    name: borurio-web

  ################################################################################################
  # PERFIL ATIVO – Controlado externamente (Docker Compose, ambiente, ou CLI)
  # ----------------------------------------------------------------------------------------------
  # NUNCA deixe o perfil fixo em “dev” aqui.
  # O valor abaixo apenas serve de fallback se não for definido via variável de ambiente.
  ################################################################################################
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  ################################################################################################
  # DATASOURCE LOCAL (somente fallback)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: borurio
    password: H4ck3r123

###############################################################################################
# SERVIDOR WEB – Porta e contexto
###############################################################################################
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

###############################################################################################
# LOGGING – Níveis e padrões
###############################################################################################
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: DEBUG
  file:
    path: logs/
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

###############################################################################################
# METADADOS DO APLICATIVO
###############################################################################################
app:
  name: Borurio ERP Fiscal BR
  version: ${project.version:1.0.0}
  description: "Configuração base. Herda de application-${spring.profiles.active}.yml"
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"

###############################################################################################
# NOTAS TÉCNICAS
# ---------------------------------------------------------------------------------------------
# - Este arquivo é o ponto de entrada do Spring Boot.
# - application-dev.yml: ambiente de desenvolvimento local (porta 8080 / MySQL 3307 / Redis 6379)
# - application-hom.yml: ambiente de homologação real (SEFAZ-SP tpAmb=2)
# - application-prd.yml: ambiente de produção (SEFAZ-SP tpAmb=1)
#
# - Perfis podem ser definidos de 3 formas:
#   1. Linha de comando: mvn spring-boot:run -Dspring-boot.run.profiles=hom
#   2. Docker Compose: SPRING_PROFILES_ACTIVE=hom
#   3. Variável de ambiente no sistema
#
# - Porta padrão interna: 8080
###############################################################################################
