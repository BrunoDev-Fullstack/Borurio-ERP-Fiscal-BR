spring:
  application:
    name: borurio-web

  jackson:
    serialization:
      indent-output: false
    time-zone: America/Sao_Paulo

  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false

  lifecycle:
    timeout-per-shutdown-phase: 30s

server:
  # Porta NÃO deve ser definida aqui
  # É controlada via profile (dev/prd) ou variável de ambiente
  shutdown: graceful
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when_authorized
