###############################################################################################
# CONFIGURAÇÃO PRINCIPAL – BORURIO ERP FISCAL BR
# ---------------------------------------------------------------------------------------------
# Função:
#   Arquivo base de configuração do Spring Boot.
#   Define apenas propriedades neutras e seguras, comuns a todos os ambientes.
#   As configurações específicas de infraestrutura (DB, Redis, portas, certificados)
#   DEVEM ser definidas exclusivamente nos arquivos application-{profile}.yml.
#
# Módulo:
#   borurio-web (API REST principal)
#
# Ambientes suportados:
#   dev  = Desenvolvimento local / mock
#   hom  = Homologação (SEFAZ-SP Homologação)
#   prd  = Produção (SEFAZ-SP Produção)
#
# Stack:
#   Spring Boot 3.3.x | Java 17 | UTF-8 (sem BOM)
#
# Autor:
#   Bruno Ribeiro – DevSecOps / Fullstack Java
# Última revisão:
#   30/01/2026
###############################################################################################

spring:
  application:
    name: borurio-web

  ##############################################################################################
  # PERFIL ATIVO (SEGURO POR PADRÃO)
  # --------------------------------------------------------------------------------------------
  # O perfil padrão é DEV.
  # Em ambientes controlados (hom, prd, CI/CD), o perfil DEVE ser definido
  # explicitamente via variável de ambiente SPRING_PROFILES_ACTIVE.
  #
  # Exemplos:
  #   SPRING_PROFILES_ACTIVE=dev
  #   SPRING_PROFILES_ACTIVE=hom
  #   SPRING_PROFILES_ACTIVE=prd
  ##############################################################################################
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

###############################################################################################
# SERVIDOR WEB
# ---------------------------------------------------------------------------------------------
# A porta do servidor NÃO é definida neste arquivo.
# Cada ambiente deve declarar sua própria porta em:
#   - application-dev.yml
#   - application-hom.yml
#   - application-prd.yml
###############################################################################################
server:
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

###############################################################################################
# LOGGING – CONFIGURAÇÃO BASE
# ---------------------------------------------------------------------------------------------
# Ajustes específicos (DEBUG, arquivos separados, rolling policies)
# devem ser realizados por ambiente via:
#   - application-{profile}.yml
#   - logback-{profile}.xml
###############################################################################################
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: INFO

###############################################################################################
# METADADOS DA APLICAÇÃO
###############################################################################################
app:
  name: Borurio ERP Fiscal BR
  version: ${project.version:1.0.0}
  description: "Configuração base do Borurio ERP Fiscal BR. Propriedades específicas são definidas por ambiente."
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"

###############################################################################################
# NOTAS TÉCNICAS
# ---------------------------------------------------------------------------------------------
# - NÃO definir neste arquivo:
#     • datasource
#     • redis
#     • certificados
#     • portas
#
# - Toda configuração sensível ou dependente de ambiente DEVE estar em:
#     application-dev.yml
#     application-hom.yml
#     application-prd.yml
#
# EXECUÇÃO LOCAL (DEV):
#   mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
#
# EXECUÇÃO HOMOLOGAÇÃO:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=hom"
#
# EXECUÇÃO PRODUÇÃO (DOCKER):
#   SPRING_PROFILES_ACTIVE=prd docker-compose -f "docker-compose.prd.yml" up -d
#
# PADRÕES ADOTADOS:
#   - Clean Architecture
#   - DevSecOps
#   - Separação rigorosa por ambiente
###############################################################################################
