###############################################################################################
# CONFIGURAÇÃO PRINCIPAL – BORURIO ERP
# ---------------------------------------------------------------------------------------------
# Arquivo base de configuração do Spring Boot.
# Contém apenas propriedades neutras e seguras compartilhadas entre ambientes.
#
# Configurações específicas devem estar em:
#   application-dev.yml
#   application-hom.yml
#   application-prd.yml
#
# Stack:
#   Spring Boot 3.3.x | Java 17 | UTF-8 (sem BOM)
#
# Autor:
#   Bruno Ribeiro – DevSecOps / Fullstack Java
###############################################################################################

spring:

  application:
    name: borurio-erp

  #############################################################################################
  # PERFIL ATIVO
  #
  # Default: dev
  # Pode ser sobrescrito por variável de ambiente
  #
  # Exemplo:
  #   SPRING_PROFILES_ACTIVE=dev
  #   SPRING_PROFILES_ACTIVE=hom
  #   SPRING_PROFILES_ACTIVE=prd
  #############################################################################################

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

###############################################################################################
# SERVIDOR WEB
###############################################################################################

server:

  servlet:
    context-path: /

  error:
    include-message: always
    include-binding-errors: always

###############################################################################################
# LOGGING BASE
# Ajustes detalhados devem ser feitos em logback-{profile}.xml
###############################################################################################

logging:

  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: INFO

###############################################################################################
# METADADOS DA APLICAÇÃO
###############################################################################################

app:

  name: Borurio ERP
  version: ${project.version:1.0.0}
  description: "ERP fiscal e logístico com emissão NF-e integrado à SEFAZ."
  owner: "Bruno Ribeiro – DevSecOps"

###############################################################################################
# CORS — CORS_ALLOWED_ORIGINS obrigatório em PRD; fallback localhost para dev/hom
###############################################################################################
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8080}

###############################################################################################
# NFE LOG — retenção de auditoria; padrão 365 dias (LGPD)
###############################################################################################
nfe:
  log:
    retencao-dias: ${NFE_LOG_RETENCAO_DIAS:365}
    retencao:
      cron: ${NFE_LOG_RETENCAO_CRON:0 0 2 * * ?}

###############################################################################################
# RATE LIMIT — proteção login e emissão NF-e
###############################################################################################
rate:
  limit:
    login:
      max: ${RATE_LIMIT_LOGIN_MAX:10}
    emitir:
      max: ${RATE_LIMIT_EMITIR_MAX:30}

###############################################################################################
# SEFAZ RETRY — padrão conservador; sobrescreva por ambiente se necessário
###############################################################################################
sefaz:
  retry:
    max-attempts: ${SEFAZ_RETRY_MAX_ATTEMPTS:3}
    wait-seconds: ${SEFAZ_RETRY_WAIT_SECONDS:2}

###############################################################################################
# NOTAS TÉCNICAS
#
# NÃO definir neste arquivo:
#   datasource
#   redis
#   certificados
#   portas
#
# Esses itens devem estar em:
#
#   application-dev.yml
#   application-hom.yml
#   application-prd.yml
#
###############################################################################################

###############################################################################################
# EXECUÇÃO
###############################################################################################

# DEV
# mvn spring-boot:run "-Dspring-boot.run.profiles=dev"

# HOM
# mvn spring-boot:run "-Dspring-boot.run.profiles=hom"

# PRD
# SPRING_PROFILES_ACTIVE=prd docker-compose -f "docker-compose.prd.yml" up -d

###############################################################################################
# PADRÕES ADOTADOS
#
# Clean Architecture
# DevSecOps
# Separação de ambientes
###############################################################################################