###############################################################################################
# CONFIGURAÇÃO PRINCIPAL — BORURIO ERP FISCAL BR
# ---------------------------------------------------------------------------------------------
# Este arquivo define o perfil ativo padrão e configurações mínimas. Os detalhes completos dos
# ambientes ficam em:
#   - application-dev.yml  → Desenvolvimento + Homologação SEFAZ (tpAmb=2)
#   - application-prd.yml  → Produção SEFAZ (tpAmb=1)
#
# Importante:
#   - O profile DEV é o padrão seguro.
#   - O profile PRD somente é ativado via variável SPRING_PROFILES_ACTIVE.
###############################################################################################

spring:
  application:
    name: borurio-web

  ##############################################################################################
  # PERFIL ATIVO PADRÃO
  # --------------------------------------------------------------------------------------------
  # Regras:
  #   - SPRING_PROFILES_ACTIVE não informado → usa DEV
  #   - Homologação SEFAZ real → SPRING_PROFILES_ACTIVE=dev
  #   - Produção real → SPRING_PROFILES_ACTIVE=prd
  #
  # IMPORTANTE:
  #   Nunca definir PRD como padrão para evitar ativação acidental.
  ##############################################################################################
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  ##############################################################################################
  # DATASOURCE LOCAL — Execução fora do Docker
  # --------------------------------------------------------------------------------------------
  # Dentro do Docker Compose, os arquivos application-dev.yml e application-prd.yml substituem
  # completamente estas propriedades.
  #
  # Esta configuração serve apenas para testes locais via IntelliJ.
  ##############################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: borurio
    password: H4ck3r123

###############################################################################################
# SERVIDOR WEB — Porta base interna (Docker mapeia externamente)
###############################################################################################
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

###############################################################################################
# LOGGING — Padrão uniforme em todos os ambientes
###############################################################################################
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: INFO
  file:
    path: logs/
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

###############################################################################################
# METADADOS DO SISTEMA
###############################################################################################
app:
  name: Borurio ERP Fiscal BR
  version: ${project.version:1.0.0}
  description: "Arquivo principal que define o profile ativo e delega às configurações dev/prd."
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"

###############################################################################################
# NOTAS TÉCNICAS
# ---------------------------------------------------------------------------------------------
# Perfis disponíveis:
#   - dev → Desenvolvimento + Homologação SEFAZ Real (tpAmb=2)
#   - prd → Produção SEFAZ Real (tpAmb=1)
#
# EXECUÇÃO:
#   DEV/HOM (default): mvn spring-boot:run "-Dspring-boot.run.profiles=dev"
#   PRD:               mvn spring-boot:run "-Dspring-boot.run.profiles=prd"
#
# Docker Compose:
#   - docker-compose.dev.yml → DEV/HOM
#   - docker-compose.prd.yml → PRD
###############################################################################################
