###############################################################################################
# CONFIGURAÇÃO PRINCIPAL – JCHO ERP
# ---------------------------------------------------------------------------------------------
# Arquivo base de configuração do Spring Boot.
# Contém apenas propriedades neutras e seguras compartilhadas entre ambientes.
#
# Configurações específicas devem estar em:
#   application-dev.yml
#   application-hom.yml
#   application-prd.yml
#
# Stack:
#   Spring Boot 3.3.x | Java 17 | UTF-8 (sem BOM)
#
# Autor:
#   Bruno Ribeiro – DevSecOps / Fullstack Java
###############################################################################################

spring:

  application:
    name: jcho-erp

  #############################################################################################
  # PERFIL ATIVO
  #
  # Default: dev
  # Pode ser sobrescrito por variável de ambiente
  #
  # Exemplo:
  #   SPRING_PROFILES_ACTIVE=dev
  #   SPRING_PROFILES_ACTIVE=hom
  #   SPRING_PROFILES_ACTIVE=prd
  #############################################################################################

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

###############################################################################################
# SERVIDOR WEB
###############################################################################################

server:

  servlet:
    context-path: /

  error:
    include-message: always
    include-binding-errors: always

###############################################################################################
# LOGGING BASE
# Ajustes detalhados devem ser feitos em logback-{profile}.xml
###############################################################################################

logging:

  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.jcho: INFO

###############################################################################################
# METADADOS DA APLICAÇÃO
###############################################################################################

app:

  name: Jcho ERP
  version: ${project.version:1.0.0}
  description: "ERP fiscal e logístico com emissão NF-e integrado à SEFAZ."
  owner: "Bruno Ribeiro – DevSecOps"

###############################################################################################
# NOTAS TÉCNICAS
#
# NÃO definir neste arquivo:
#   datasource
#   redis
#   certificados
#   portas
#
# Esses itens devem estar em:
#
#   application-dev.yml
#   application-hom.yml
#   application-prd.yml
#
###############################################################################################

###############################################################################################
# EXECUÇÃO
###############################################################################################

# DEV
# mvn spring-boot:run "-Dspring-boot.run.profiles=dev"

# HOM
# mvn spring-boot:run "-Dspring-boot.run.profiles=hom"

# PRD
# SPRING_PROFILES_ACTIVE=prd docker-compose -f "docker-compose.prd.yml" up -d

###############################################################################################
# PADRÕES ADOTADOS
#
# Clean Architecture
# DevSecOps
# Separação de ambientes
###############################################################################################