###################################################################################################
# AMBIENTE DE PRODUÇÃO – BORURIO ERP FISCAL BR
# ________________________________________________________________________________________________
# Módulo: borurio-web (API REST principal)
# Integrações: MySQL, Redis, SEFAZ-SP (NF-e 4.00 Produção Real)
# Stack: Spring Boot 3.3.x | Java 17 | UTF-8 sem BOM
# Autor: Bruno Ribeiro – Desenvolvedor Fullstack / DevSecOps
# Última revisão: 17/12/2025
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

###################################################################################################
# SPRING CORE
###################################################################################################
spring:
  application:
    name: borurio-web-prd

  ################################################################################################
  # BANCO DE DADOS – MYSQL 8.4 (PRODUÇÃO)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: >
      jdbc:mysql://${MYSQL_HOST:borurio-mysql-prd}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:borurio_fiscal_prd}
      ?useSSL=false
      &allowPublicKeyRetrieval=true
      &serverTimezone=America/Sao_Paulo
    username: ${MYSQL_USER:borurio}
    password: ${MYSQL_PASSWORD:H4ck3r123}
    hikari:
      pool-name: BorurioWebHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  ################################################################################################
  # JPA / HIBERNATE
  ################################################################################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  ################################################################################################
  # REDIS – SPRING BOOT 3.x (CORRETO)
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:borurio-redis-prd}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      connect-timeout: 2s

  ################################################################################################
  # JACKSON – SERIALIZAÇÃO JSON
  ################################################################################################
  jackson:
    serialization:
      indent-output: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # SPRING MVC / WEB
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console

  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

###################################################################################################
# LOGGING – PRODUÇÃO
###################################################################################################
logging:
  config: classpath:logback-prd.xml
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    br.com.borurio: INFO

###################################################################################################
# SEFAZ-SP – PRODUÇÃO REAL (tpAmb=1)
###################################################################################################
sefaz:
  ambiente: PRODUCAO
  tpAmb: 1
  urls:
    autorizacao: "https://nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    retorno: "https://nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    consulta: "https://nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    status: "https://nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"
    inutilizacao: "https://nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx"
    recepcao-evento: "https://nfe.fazenda.sp.gov.br/ws/NFeRecepcaoEvento4.asmx"

###################################################################################################
# FISCAL – CERTIFICADO DIGITAL A1 (PFX REAL)
###################################################################################################
fiscal:
  certificado:
    enabled: true
    path: ${CERT_PATH:/app/certs/keystore/certificado-prd.pfx}
    pass: ${CERT_PASS:SENHA_DO_CERTIFICADO_REAL}

  truststore:
    path: ${TRUSTSTORE_PATH:/app/certs/truststore/sefaz-truststore.jks}
    pass: ${TRUSTSTORE_PASS:changeit}

###################################################################################################
# ACTUATOR – OBSERVABILIDADE (PORTA SEPARADA EM PRD)
###################################################################################################
management:
  server:
    port: 8281

  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: never

  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: prd
  description: "Ambiente de Produção SEFAZ-SP (tpAmb=1)"
  version: ${APP_VERSION:1.0.0}
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"
