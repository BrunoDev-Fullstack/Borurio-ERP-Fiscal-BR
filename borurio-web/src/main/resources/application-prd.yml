###################################################################################################
# AMBIENTE DE PRODUÇÃO — BORURIO ERP FISCAL BR
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /

spring:

  application:
    name: borurio-erp

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER}
    password: ${DB_PASS}

    hikari:
      pool-name: BorurioWebHikariPool-PRD
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: false

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 5000

  jackson:
    serialization:
      indent_output: false
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

logging:
  config: classpath:logback-prd.xml
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    br.com.borurio: INFO

security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

cert:
  encryption:
    key: ${CERT_ENCRYPTION_KEY}

sefaz:
  ambiente: PRD
  tpAmb: 1
  urls:
    autorizacao: https://nfe.fazenda.sp.gov.br/ws/nfeautorizacao4.asmx
    retorno: https://nfe.fazenda.sp.gov.br/ws/nferetautorizacao4.asmx
    consulta: https://nfe.fazenda.sp.gov.br/ws/nfeconsultaprotocolo4.asmx
    status: https://nfe.fazenda.sp.gov.br/ws/nfestatusservico4.asmx
    inutilizacao: https://nfe.fazenda.sp.gov.br/ws/nfeinutilizacao4.asmx
    recepcao-evento: https://nfe.fazenda.sp.gov.br/ws/nferecepcaoevento4.asmx
    manifestacao-evento: https://www.nfe.fazenda.gov.br/NFeRecepcaoEvento4/NFeRecepcaoEvento4.asmx

fiscal:
  certificate:
    path: ${FISCAL_CERT_PATH}
    password: ${FISCAL_CERT_PASSWORD}

  emitente:
    cnpj:              ${FISCAL_EMITENTE_CNPJ}
    razao-social:      ${FISCAL_EMITENTE_RAZAO_SOCIAL}
    nome-fantasia:     ${FISCAL_EMITENTE_NOME_FANTASIA:}
    ie:                ${FISCAL_EMITENTE_IE}
    crt:               ${FISCAL_EMITENTE_CRT:1}
    logradouro:        ${FISCAL_EMITENTE_LOGRADOURO}
    numero:            ${FISCAL_EMITENTE_NUMERO}
    bairro:            ${FISCAL_EMITENTE_BAIRRO}
    municipio:         ${FISCAL_EMITENTE_MUNICIPIO}
    codigo-municipio:  ${FISCAL_EMITENTE_CODIGO_MUNICIPIO}
    uf:                ${FISCAL_EMITENTE_UF}
    cep:               ${FISCAL_EMITENTE_CEP}

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

app:
  profile: prd
  description: "Ambiente de produção SEFAZ-SP"
  version: ${project.version:1.0.0}