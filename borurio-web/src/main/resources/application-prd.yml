###################################################################################################
# AMBIENTE DE PRODUÇÃO — BORURIO ERP FISCAL BR
# -----------------------------------------------------------------------------------------------
# API REST principal — Integração real com SEFAZ-SP (NF-e 4.00)
# Autor: Bruno Ribeiro — DevSecOps / Fullstack Java
# Revisão: 26/11/2025
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

###################################################################################################
# SPRING CORE
###################################################################################################
spring:
  application:
    name: borurio-web-prd

  ################################################################################################
  # BANCO DE DADOS — MYSQL PRODUÇÃO
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:borurio-mysql-prd}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:borurio_fiscal_prd}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${MYSQL_USER:borurio}
    password: ${MYSQL_PASSWORD:H4ck3r123}
    hikari:
      pool-name: BorurioWebHikariPool
      maximum-pool-size: 15
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  ################################################################################################
  # REDIS — PRODUÇÃO
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:borurio-redis-prd}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON — PADRÃO BRASIL
  ################################################################################################
  jackson:
    serialization:
      indent_output: false
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # MVC / CORS — PRODUÇÃO RESTRITIVO
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console

  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  web:
    resources:
      add-mappings: true
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://erp.borurio.com.br}
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: Content-Type,Authorization
      allow-credentials: true

###################################################################################################
# LOGGING — PRODUÇÃO
###################################################################################################
logging:
  config: classpath:logback-prd.xml
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    br.com.borurio: INFO
  file:
    path: /var/log/borurio
    name: borurio-prd.log

###################################################################################################
# SEFAZ — PRODUÇÃO REAL (tpAmb=1)
###################################################################################################
sefaz:
  ambiente: PRD
  tpAmb: 1
  urls:
    autorizacao: "https://nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    retorno:     "https://nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    consulta:    "https://nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    status:      "https://nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"
    inutilizacao: "https://nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx"
    recepcao-evento: "https://nfe.fazenda.sp.gov.br/ws/RecepcaoEvento4.asmx"

###################################################################################################
# CERTIFICADO DIGITAL — PRODUÇÃO REAL
###################################################################################################
fiscal:
  cert:
    enabled: true
    path: ${CERT_PATH:/app/certificados/pfx/certificado-jcho.pfx}
    pass: ${CERT_PASS:Jcho237888}

###################################################################################################
# ACTUATOR — SEGURO EM PRODUÇÃO
###################################################################################################
management:
  server:
    port: 8281
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: never
  security:
    enabled: false

###################################################################################################
# METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: prd
  description: "Ambiente Produção SEFAZ-SP | tpAmb=1"
  version: ${APP_VERSION:1.0.0}
  owner: "Bruno Ribeiro — DevSecOps / Fullstack Java"

###################################################################################################
# NOTAS TÉCNICAS
# - Certificado A1 JCHO montado no container via volume: /app/certificados/pfx/
# - Comunicação mTLS obrigatória para SEFAZ
# - Web não usa Flyway; módulo fiscal sim
# - Log rotacionado via logback-prd.xml
###################################################################################################
