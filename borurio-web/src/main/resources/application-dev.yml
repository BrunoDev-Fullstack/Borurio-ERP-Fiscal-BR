###################################################################################################
# AMBIENTE DEV — BORURIO ERP FISCAL BR
# ________________________________________________________________________________________________
# Execução local para integração com SEFAZ (homologação real)
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # BANCO DE DADOS — MYSQL (DEV)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:borurio}?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    hikari:
      pool-name: BorurioWebHikariPool-DEV
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  ################################################################################################
  # JPA
  ################################################################################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  ################################################################################################
  # FLYWAY — CORREÇÃO CRÍTICA
  ################################################################################################
  flyway:
    enabled: true
    baseline-on-migrate: true

  ################################################################################################
  # REDIS — DEV
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON
  ################################################################################################
  jackson:
    serialization:
      indent_output: false
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

###################################################################################################
# LOGGING
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache: WARN
    br.com.borurio: DEBUG

###################################################################################################
# SEGURANÇA — JWT
###################################################################################################
security:
  jwt:
    secret: "borurio-dev-secret-2026-sefaz-integration-abcdef"
    expiration-ms: 3600000

###################################################################################################
# SEFAZ — HOMOLOGAÇÃO SP
###################################################################################################
sefaz:
  ambiente: HOM
  tpAmb: 2
  urls:
    autorizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeautorizacao4.asmx
    retorno: https://homologacao.nfe.fazenda.sp.gov.br/ws/nferetautorizacao4.asmx
    consulta: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeconsultaprotocolo4.asmx
    status: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfestatusservico4.asmx
    inutilizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeinutilizacao4.asmx
    recepcao-evento: https://homologacao.nfe.fazenda.sp.gov.br/ws/nferecepcaoevento4.asmx

###################################################################################################
# CERTIFICADO DIGITAL A1
###################################################################################################
fiscal:
  certificate:
    path: ${CERT_PATH:C:/temp/cert.pfx}
    password: ${CERT_PASS:123456}

###################################################################################################
# ACTUATOR
###################################################################################################
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# METADADOS
###################################################################################################
app:
  profile: dev
  description: "Ambiente DEV — Integração SEFAZ SP"
  version: ${project.version:1.0.0}