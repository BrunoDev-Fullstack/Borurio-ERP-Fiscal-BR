###################################################################################################
# AMBIENTE DE HOMOLOGAÇÃO — BORURIO ERP FISCAL BR
# ________________________________________________________________________________________________
# Módulo: borurio-web (API REST principal)
# Integrações: MySQL, Redis, SEFAZ-SP (Homologação)
#
# Ambiente REAL — exige certificado A1 válido
###################################################################################################

server:
  address: 0.0.0.0
  port: 8081
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-hom

  ################################################################################################
  # BANCO DE DADOS — MYSQL (HOMOLOGAÇÃO)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=true&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASS}
    hikari:
      pool-name: BorurioWebHikariPool-HOM
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  ################################################################################################
  # JPA — WEB NÃO GERENCIA SCHEMA
  ################################################################################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  ################################################################################################
  # FLYWAY — DESATIVADO NO WEB
  ################################################################################################
  flyway:
    enabled: false

  ################################################################################################
  # REDIS — HOMOLOGAÇÃO
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON
  ################################################################################################
  jackson:
    serialization:
      indent_output: false
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

###################################################################################################
# LOGGING
###################################################################################################
logging:
  config: classpath:logback-hom.xml
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache: WARN
    br.com.borurio: INFO

###################################################################################################
# SEGURANÇA — JWT
###################################################################################################
security:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 3600000

###################################################################################################
# SEFAZ — HOMOLOGAÇÃO REAL (MESMO CONTRATO DO DEV)
###################################################################################################
sefaz:
  ambiente: HOM
  tpAmb: 2
  urls:
    autorizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeautorizacao4.asmx
    retorno: https://homologacao.nfe.fazenda.sp.gov.br/ws/nferetautorizacao4.asmx
    consulta: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeconsultaprotocolo4.asmx
    status: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfestatusservico4.asmx
    inutilizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeinutilizacao4.asmx
    recepcao-evento: https://homologacao.nfe.fazenda.sp.gov.br/ws/nferecepcaoevento4.asmx

###################################################################################################
# CERTIFICADO DIGITAL — A1
###################################################################################################
fiscal:
  cert:
    enabled: true
    path: ${CERT_PFX_PATH}
    pass: ${CERT_PFX_PASSWORD}

###################################################################################################
# ACTUATOR
###################################################################################################
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true
  security:
    enabled: false

###################################################################################################
# METADADOS
###################################################################################################
app:
  profile: hom
  description: "Ambiente de Homologação — SEFAZ-SP (NF-e 4.00)"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro — DevSecOps / Fullstack Java"
