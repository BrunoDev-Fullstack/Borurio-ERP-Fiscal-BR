###################################################################################################
# AMBIENTE DE DESENVOLVIMENTO — BORURIO ERP FISCAL BR
# ________________________________________________________________________________________________
# Módulo: borurio-web (API REST principal)
# Integrações: MySQL, Redis, SEFAZ-SP (NF-e 4.00 Homologação Real)
# Stack: Spring Boot 3.3.x | Java 17 | UTF-8 sem BOM
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# Última revisão: 07/11/2025
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # BANCO DE DADOS — MySQL 8.4 (Desenvolvimento / Homologação)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:borurio_fiscal_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:borurio}
    password: ${DB_PASS:H4ck3r123}
    hikari:
      pool-name: BorurioWebHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  ################################################################################################
  # REDIS — Cache e Sessões de Aplicação
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON — Serialização JSON e Padrões Regionais
  ################################################################################################
  jackson:
    serialization:
      indent_output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # SPRING CORE — Configuração Geral e MVC
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**
  web:
    resources:
      add-mappings: true
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

###################################################################################################
# LOGGING — Auditoria, Diagnóstico e Rastreabilidade
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

###################################################################################################
# SEFAZ-SP — Integração NF-e (Homologação Real, tpAmb=2)
###################################################################################################
sefaz:
  ambiente: HOMOLOGACAO
  tpAmb: 2
  urls:
    autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"
    inutilizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx"
    recepcao-evento: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRecepcaoEvento4.asmx"

  # Compatibilidade com serviços legados e transmissões antigas
  url-autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
  url-retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
  url-consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
  url-status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"

###################################################################################################
# LEGADO — Estrutura compatível com NfeTransmitServiceImpl
###################################################################################################
nfe:
  sefaz:
    tpAmb: 2
    certificado: ${NFE_SEFAZ_CERTIFICADO:/app/certificados/certificado-hom.pfx}
    senha: ${NFE_SEFAZ_SENHA:123456}
    url-autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    url-retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    url-consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    url-status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"

###################################################################################################
# FISCAL — Certificado Digital A1 (PFX)
###################################################################################################
fiscal:
  cert:
    path: ${CERT_PATH:/app/certificados/certificado-hom.pfx}
    pass: ${CERT_PASS:123456}

###################################################################################################
# ACTUATOR — Monitoramento, Saúde e Observabilidade (DEV)
###################################################################################################
management:
  server:
    port: 8080
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true
  security:
    enabled: false

###################################################################################################
# PERFIL ATIVO E METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: dev
  description: "Ambiente de Desenvolvimento e Homologação SEFAZ-SP (tpAmb=2)"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro — DevSecOps / Fullstack Java"

###################################################################################################
# NOTAS TÉCNICAS
# ________________________________________________________________________________________________
# - Infraestrutura Docker Compose ativa (MySQL 3307 / Redis 6379 / MinIO / Mailpit)
# - Comunicação direta com SEFAZ-SP Homologação Real (tpAmb=2)
# - Certificado Digital A1 armazenado em /app/certificados/
# - Flyway ativo apenas no módulo fiscal
# - API principal e Actuator unificados na porta 8080
# - Segurança via Spring Security + JWT
# - Actuator exposto apenas no perfil dev
###################################################################################################
