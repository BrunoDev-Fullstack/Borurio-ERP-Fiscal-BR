###################################################################################################
# AMBIENTE DE DESENVOLVIMENTO / HOMOLOGAÇÃO REAL — BORURIO ERP FISCAL BR
# -----------------------------------------------------------------------------------------------
# Este ambiente executa transmissão REAL via SEFAZ-SP (tpAmb=2).
# Certificado A1 oficial JCHO ativado.
# URLS oficiais da NFe 4.00.
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # BANCO DE DADOS — MYSQL (DEV)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:borurio_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:borurio}
    password: ${DB_PASS:H4ck3r123}
    hikari:
      pool-name: BorurioWebHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  flyway:
    enabled: false

  ################################################################################################
  # REDIS
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON / JSON
  ################################################################################################
  jackson:
    serialization:
      indent_output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # MVC / GENERAL
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console

  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  web:
    resources:
      add-mappings: true
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

###################################################################################################
# LOGGING
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: DEBUG

###################################################################################################
# SEFAZ — HOMOLOGAÇÃO REAL (tpAmb=2)
###################################################################################################
sefaz:
  ambiente: HOM
  tpAmb: 2
  urls:
    autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"
    inutilizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx"
    recepcao-evento: "https://homologacao.nfe.fazenda.sp.gov.br/ws/RecepcaoEvento4.asmx"

###################################################################################################
# CERTIFICADO DIGITAL — CAMINHO CORRETO DENTRO DO DOCKER
###################################################################################################
fiscal:
  cert:
    enabled: true
    path: "/app/certificados/pfx/certificado-jcho.pfx"
    pass: "Jcho237888"

###################################################################################################
# ACTUATOR
###################################################################################################
management:
  server:
    port: 8080
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true
  security:
    enabled: false

###################################################################################################
# METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: dev
  description: "Ambiente DEV/HOM — Transmissão real SEFAZ-SP"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro — DevSecOps / Fullstack Java"
