###################################################################################################
# AMBIENTE DE DESENVOLVIMENTO – BORURIO ERP FISCAL BR
# -----------------------------------------------------------------------------------------------
# Módulo: borurio-web (API REST principal)
# Integrações: MySQL, Redis, SEFAZ-SP (NF-e 4.00 Homologação)
# Stack: Spring Boot 3.3.x | Java 17 | UTF-8 sem BOM
###################################################################################################

server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # BANCO DE DADOS – MySQL 8.4
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:borurio-mysql-dev}:${DB_PORT:3306}/${DB_NAME:borurio_fiscal_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:borurio}
    password: ${DB_PASS:H4ck3r123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  ################################################################################################
  # REDIS – Cache e Sessões
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:borurio-redis-dev}
      port: ${REDIS_PORT:6379}
      timeout: 2000

  ################################################################################################
  # JACKSON – Serialização JSON (formatação padrão brasileira)
  ################################################################################################
  jackson:
    serialization:
      indent_output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR

  ################################################################################################
  # SPRING CORE – Configurações gerais
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  ################################################################################################
  # SPRING WEB – CORS e Recursos Estáticos
  ################################################################################################
  web:
    resources:
      add-mappings: true
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

###################################################################################################
# LOGGING – Auditoria e Rastreabilidade (via Logback)
###################################################################################################
logging:
  level:
    root: INFO
    org.springframework: INFO
    br.com.borurio: DEBUG
  config: classpath:logback-dev.xml
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

###################################################################################################
# SEFAZ – Integração NF-e (Homologação SP)
###################################################################################################
sefaz:
  ambiente: homologacao
  url-autorizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx
  url-retorno: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx

###################################################################################################
# FISCAL – Certificado Digital A1 (PFX)
###################################################################################################
fiscal:
  cert:
    path: ${CERT_PATH:C:/Projetos/borurio-erp-br/borurio-fiscal/src/main/resources/certs/generic-dev-cert.pfx}
    pass: ${CERT_PASS:1234}

###################################################################################################
# ACTUATOR – Monitoramento e Observabilidade
###################################################################################################
management:
  server:
    port: 8080
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,env,beans"
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# PERFIL ATIVO E METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: dev
  description: "Ambiente de Desenvolvimento – Mock SEFAZ-SP ativo"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"
