###################################################################################################
# AMBIENTE DEV — BORURIO ERP FISCAL BR
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # MYSQL — DEV
  # Default local: Windows + Docker expondo MySQL em localhost:3307.
  # Docker: docker-compose.dev.yml sobrescreve via SPRING_DATASOURCE_URL.
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/borurio_fiscal_dev?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000}
    username: ${SPRING_DATASOURCE_USERNAME:borurio}
    password: ${SPRING_DATASOURCE_PASSWORD:H4ck3r123}

    hikari:
      pool-name: BorurioWebHikariPool-DEV
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true
      initialization-fail-timeout: 30000

  ################################################################################################
  # JPA
  ################################################################################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  ################################################################################################
  # FLYWAY
  ################################################################################################
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:sql/migration

  ################################################################################################
  # JACKSON
  ################################################################################################
  jackson:
    serialization:
      indent_output: false
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

###################################################################################################
# LOGGING
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache: WARN
    br.com.borurio: DEBUG

###################################################################################################
# CORS
###################################################################################################
cors:
  allowed-origins: http://localhost:8080,http://localhost:3000,http://localhost:5173

###################################################################################################
# JWT
###################################################################################################
security:
  jwt:
    secret: "borurio-dev-secret-2026-sefaz-integration-abcdef"
    expiration-ms: 3600000

###################################################################################################
# SEFAZ — HOMOLOGAÇÃO SP
###################################################################################################
sefaz:
  ambiente: HOM
  tpAmb: 2
  urls:
    autorizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeautorizacao4.asmx
    retorno: https://homologacao.nfe.fazenda.sp.gov.br/ws/nferetautorizacao4.asmx
    consulta: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeconsultaprotocolo4.asmx
    status: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfestatusservico4.asmx
    inutilizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/nfeinutilizacao4.asmx
    recepcao-evento: https://homologacao.nfe.fazenda.sp.gov.br/ws/nferecepcaoevento4.asmx

###################################################################################################
# CERTIFICADO A1
# Local: default Windows.
# Docker: sobrescrito por FISCAL_CERT_PATH no docker-compose.dev.yml.
###################################################################################################
fiscal:
  certificate:
    path: ${FISCAL_CERT_PATH}
    password: ${FISCAL_CERT_PASSWORD}

  emitente:
    cnpj:              ${FISCAL_EMITENTE_CNPJ:54393421000159}
    razao-social:      ${FISCAL_EMITENTE_RAZAO_SOCIAL:JCHO GLOBAL LTDA}
    nome-fantasia:     ${FISCAL_EMITENTE_NOME_FANTASIA:JCHO GLOBAL}
    ie:                ${FISCAL_EMITENTE_IE:ISENTO}
    crt:               ${FISCAL_EMITENTE_CRT:1}
    logradouro:        ${FISCAL_EMITENTE_LOGRADOURO:Rua Teste Homologacao}
    numero:            ${FISCAL_EMITENTE_NUMERO:1}
    bairro:            ${FISCAL_EMITENTE_BAIRRO:Centro}
    municipio:         ${FISCAL_EMITENTE_MUNICIPIO:Sao Paulo}
    codigo-municipio:  ${FISCAL_EMITENTE_CODIGO_MUNICIPIO:3550308}
    uf:                ${FISCAL_EMITENTE_UF:SP}
    cep:               ${FISCAL_EMITENTE_CEP:01310100}

###################################################################################################
# ACTUATOR
###################################################################################################
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# METADADOS
###################################################################################################
app:
  profile: dev
  description: "Ambiente DEV — Integração SEFAZ SP"
  version: ${project.version:1.0.0}