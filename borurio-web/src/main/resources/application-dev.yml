###################################################################################################
# AMBIENTE DEV — BORURIO ERP FISCAL BR
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # MYSQL — CONFIGURAÇÃO FIXA PARA EVITAR VARIÁVEIS INCONSISTENTES
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver

    # Configuração fixa para garantir previsibilidade durante estabilização do ambiente
    # Evita dependência de variáveis que podem não estar sendo carregadas no container
    url: jdbc:mysql://borurio-mysql-dev:3306/borurio_fiscal_dev?useSSL=false&serverTimezone=America/Sao_Paulo&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000

    username: borurio
    password: H4ck3r123

    hikari:
      pool-name: BorurioWebHikariPool-DEV
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

      # Fail-fast ajuda a detectar erro imediatamente na subida
      initialization-fail-timeout: 30000

  ################################################################################################
  # JPA
  ################################################################################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: false
        show_sql: false

  ################################################################################################
  # FLYWAY
  ################################################################################################
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  ################################################################################################
  # REDIS — DOCKER
  ################################################################################################
  data:
    redis:
      # Aqui faz sentido manter variável pois não afeta boot crítico
      host: ${REDIS_HOST:borurio-redis-dev}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON
  ################################################################################################
  jackson:
    serialization:
      indent_output: false
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

###################################################################################################
# LOGGING
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    org.apache: WARN
    br.com.borurio: DEBUG

###################################################################################################
# JWT
###################################################################################################
security:
  jwt:
    secret: "borurio-dev-secret-2026-sefaz-integration-abcdef"
    expiration-ms: 3600000

###################################################################################################
