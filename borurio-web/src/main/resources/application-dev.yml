###################################################################################################
# AMBIENTE DE DESENVOLVIMENTO — BORURIO ERP FISCAL BR
# ________________________________________________________________________________________________
# Módulo: borurio-web (API REST principal)
# Integrações: MySQL, Redis, Modo SEFAZ-MOCK (dev)
# Autor: Bruno Ribeiro — DevSecOps / Fullstack Java
###################################################################################################

server:
  address: 0.0.0.0
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # BANCO DE DADOS — MYSQL (DEV)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:borurio_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:borurio}
    password: ${DB_PASS:H4ck3r123}
    hikari:
      pool-name: BorurioWebHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  ################################################################################################
  # JPA — Módulo WEB NÃO gerencia tabelas fiscais
  ################################################################################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
        show_sql: false

  ################################################################################################
  # FLYWAY DESATIVADO NO WEB
  ################################################################################################
  flyway:
    enabled: false

  ################################################################################################
  # REDIS
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON — FORMATAÇÃO JSON
  ################################################################################################
  jackson:
    serialization:
      indent_output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # SPRING CORE / CORS / MVC
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console

  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

  web:
    resources:
      add-mappings: true
    cors:
      allowed-origins: "*"
      allowed-methods: "*"
      allowed-headers: "*"

###################################################################################################
# LOGGING — Auditoria / Diagnóstico
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: DEBUG

###################################################################################################
# SEFAZ — MODO MOCK NO DEV (NÃO CONSULTA SERVIDOR REAL)
###################################################################################################
sefaz:
  ambiente: MOCK
  tpAmb: 2
  urls:
    autorizacao: "http://localhost:9999/mock/sefaz/autorizacao"
    retorno: "http://localhost:9999/mock/sefaz/retorno"
    consulta: "http://localhost:9999/mock/sefaz/consulta"
    status: "http://localhost:9999/mock/sefaz/status"
    inutilizacao: "http://localhost:9999/mock/sefaz/inutilizacao"
    recepcao-evento: "http://localhost:9999/mock/sefaz/evento"

###################################################################################################
# CERTIFICADO DIGITAL — DEV NÃO USA (somente HOM/PRD)
###################################################################################################
fiscal:
  cert:
    enabled: false
    path: ""
    pass: ""

###################################################################################################
# ACTUATOR
###################################################################################################
management:
  server:
    port: 8080
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true
  security:
    enabled: false

###################################################################################################
# METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: dev
  description: "Ambiente de Desenvolvimento — SEFAZ MOCK"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro — DevSecOps / Fullstack Java"
