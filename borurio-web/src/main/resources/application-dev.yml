###################################################################################################
# AMBIENTE DE DESENVOLVIMENTO – BORURIO ERP FISCAL BR
# -----------------------------------------------------------------------------------------------
# Módulo: borurio-web (API REST principal)
# Integrações: MySQL, Redis, SEFAZ-SP (NF-e 4.00 Homologação Real)
# Stack: Spring Boot 3.3.x | Java 17 | UTF-8 sem BOM
# Autor: Bruno Ribeiro – Desenvolvedor Fullstack / DevSecOps
###################################################################################################

server:
  port: 8082                                  # Porta interna da API principal (exposta como 8082 no Docker)
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # BANCO DE DADOS – MySQL 8.4 (ambiente de homologação / dev)
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:borurio-mysql-dev}:${DB_PORT:3306}/${DB_NAME:borurio_fiscal_dev}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${DB_USER:borurio}
    password: ${DB_PASS:H4ck3r123}
    hikari:
      pool-name: BorurioWebHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.format_sql: true
      hibernate.show_sql: false

  ################################################################################################
  # REDIS – Cache e Sessões
  ################################################################################################
  data:
    redis:
      host: ${REDIS_HOST:borurio-redis-dev}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  ################################################################################################
  # JACKSON – Serialização JSON (formatação padrão brasileira)
  ################################################################################################
  jackson:
    serialization:
      indent_output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # SPRING CORE – Configurações gerais e MVC
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**
  web:
    resources:
      add-mappings: true
    cors:
      allowed-origins: "*"
      allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
      allowed-headers: "*"

###################################################################################################
# LOGGING – Auditoria e Rastreabilidade (via Logback)
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

###################################################################################################
# SEFAZ-SP – Integração NF-e (Homologação Real - tpAmb=2)
###################################################################################################
sefaz:
  ambiente: HOMOLOGACAO
  tpAmb: 2
  urls:
    autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"
    inutilizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx"
    recepcao-evento: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRecepcaoEvento4.asmx"

  # ---------------------------------------------------------------------------------------------
  # SUPORTE LEGADO – Compatibilidade com classes antigas (NfeTransmitServiceImpl)
  # ---------------------------------------------------------------------------------------------
  url-autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
  url-retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
  url-consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
  url-status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"

###################################################################################################
# LEGADO – Estrutura esperada por NfeTransmitServiceImpl
###################################################################################################
nfe:
  sefaz:
    tpAmb: 2
    certificado: ${NFE_SEFAZ_CERTIFICADO:/app/certificados/certificado-hom.pfx}
    senha: ${NFE_SEFAZ_SENHA:123456}
    url-autorizacao: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
    url-retorno: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"
    url-consulta: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx"
    url-status: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx"

###################################################################################################
# FISCAL – Certificado Digital A1 (PFX)
###################################################################################################
fiscal:
  cert:
    path: ${CERT_PATH:/app/certificados/certificado-hom.pfx}
    pass: ${CERT_PASS:123456}

###################################################################################################
# ACTUATOR – Monitoramento e Observabilidade
###################################################################################################
management:
  server:
    port: 8081
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "health,info,metrics,env,beans,loggers"
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# PERFIL ATIVO E METADADOS DO AMBIENTE
###################################################################################################
app:
  profile: dev
  description: "Ambiente de Desenvolvimento e Homologação SEFAZ-SP (tpAmb=2)"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"

###################################################################################################
# NOTAS TÉCNICAS
# -----------------------------------------------------------------------------------------------
# - Ambiente integrado Docker Compose (MySQL 3307 / Redis 6379 / MinIO / Mailpit)
# - Comunicação direta com SEFAZ-SP (Homologação Real, tpAmb=2)
# - Certificado Digital A1 mapeado via Docker volume /app/certificados/
# - Flyway ativo no módulo fiscal, desativado no web
# - API principal: 8082 | Actuator: 8081
# - Configuração validada para container borurio-web-dev
# - Segurança: Spring Security + JWT ativo
###################################################################################################
