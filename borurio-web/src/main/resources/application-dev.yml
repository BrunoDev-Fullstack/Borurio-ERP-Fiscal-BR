###################################################################################################
# AMBIENTE DE DESENVOLVIMENTO / HOMOLOGAÇÃO — BORURIO ERP FISCAL BR
###################################################################################################

server:
  address: 0.0.0.0
  port: 8081
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

spring:
  application:
    name: borurio-web-dev

  ################################################################################################
  # BANCO DE DADOS — MYSQL (DEV / HOM)
  # SCHEMA ÚNICO: borurio_dev
  ################################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/borurio_dev?useSSL=false&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: borurio
    password: H4ck3r123
    hikari:
      pool-name: BorurioWebHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  ################################################################################################
  # JPA / HIBERNATE
  ################################################################################################
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
        show_sql: false

  ################################################################################################
  # FLYWAY — DEV / HOM
  ################################################################################################
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: false
    baseline-on-migrate: true
    baseline-version: 0

  ################################################################################################
  # REDIS — SPRING DATA REDIS (AUTO-CONFIGURAÇÃO)
  ################################################################################################
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  ################################################################################################
  # JACKSON — PADRÃO CORPORATIVO
  ################################################################################################
  jackson:
    serialization:
      indent-output: true
    date-format: yyyy-MM-dd'T'HH:mm:ss
    time-zone: America/Sao_Paulo
    locale: pt_BR
    default-property-inclusion: non_null

  ################################################################################################
  # SPRING CORE
  ################################################################################################
  main:
    allow-bean-definition-overriding: true
    banner-mode: console

  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**

###################################################################################################
# LOGGING
###################################################################################################
logging:
  config: classpath:logback-dev.xml
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: DEBUG

###################################################################################################
# SEFAZ — HOMOLOGAÇÃO (SP)
###################################################################################################
sefaz:
  ambiente: HOM
  tpAmb: 2
  uf: SP
  schema-path: classpath:schemas/nfe

  urls:
    autorizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx
    retorno: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx
    consulta: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeConsultaProtocolo4.asmx
    status: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeStatusServico4.asmx
    inutilizacao: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeInutilizacao4.asmx
    recepcao-evento: https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRecepcaoEvento4.asmx

###################################################################################################
# CERTIFICADO DIGITAL — DEV / HOM (DESABILITADO)
###################################################################################################
fiscal:
  certificate:
    enabled: false
    type: PKCS12
    pfx-path: /app/certs/keystore/jcho-keystore.p12
    pfx-password: Jcho237888
    truststore-path: /app/certs/truststore/sefaz-truststore.jks
    truststore-password: changeit

###################################################################################################
# ACTUATOR
###################################################################################################
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# METADADOS DA APLICAÇÃO (AppProperties)
###################################################################################################
app:
  name: borurio-erp-fiscal
  environment: DEV
  banner-enabled: true

  profile: dev
  description: "Ambiente de Homologação — SEFAZ-SP"
  version: ${project.version:1.0.0}
  owner: "Bruno Ribeiro — DevSecOps / Fullstack Java"
