    path: /app/certificados/pfx/certificado-jcho.pfx
    password: 2025@Qz1

###################################################################################################
# ACTUATOR
###################################################################################################
management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    ping:
      enabled: true

###################################################################################################
# METADADOS
###################################################################################################
app:
  profile: dev
  description: "Ambiente DEV — Integração SEFAZ SP"
  version: ${project.version:1.0.0}