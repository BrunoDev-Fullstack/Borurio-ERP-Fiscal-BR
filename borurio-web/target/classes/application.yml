###############################################################################################
# CONFIGURAÇÃO PRINCIPAL – BORURIO ERP FISCAL BR
# ---------------------------------------------------------------------------------------------
# Função:
#   Define o perfil ativo e as configurações mínimas comuns a todos os ambientes.
#   Este arquivo é o ponto de entrada do Spring Boot e herda as propriedades do
#   arquivo application-${spring.profiles.active}.yml correspondente.
#
# Módulo:
#   borurio-web (API REST principal)
#
# Ambientes suportados:
#   dev  = Desenvolvimento local
#   hom  = Homologação (SEFAZ-SP Homologação)
#   prd  = Produção Real (SEFAZ-SP Produção)
#
# Stack:
#   Spring Boot 3.3.x | Java 17 | UTF-8 sem BOM
#
# Autor:
#   Bruno Ribeiro – Desenvolvedor Fullstack / DevSecOps
# Última revisão:
#   03/11/2025
###############################################################################################

spring:
  application:
    name: borurio-web

  ##############################################################################################
  # PERFIL ATIVO – Define qual arquivo de configuração será carregado
  # --------------------------------------------------------------------------------------------
  # O Spring Boot utilizará o valor informado aqui como perfil ativo padrão.
  # Pode ser sobrescrito via variável de ambiente SPRING_PROFILES_ACTIVE (em Docker ou CI/CD).
  #
  # Exemplo:
  #   SPRING_PROFILES_ACTIVE=prd → carrega application-prd.yml
  #   SPRING_PROFILES_ACTIVE=hom → carrega application-hom.yml
  #
  # Por padrão, se nenhuma variável for informada, o ambiente de Produção (prd) será carregado.
  ##############################################################################################
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:prd}

  ##############################################################################################
  # DATASOURCE LOCAL – Configuração para execução fora do Docker (opcional)
  # --------------------------------------------------------------------------------------------
  # Observação:
  #   Dentro do Docker Compose, os parâmetros abaixo são substituídos pelas variáveis de ambiente.
  #   Fora do Docker, permite testes locais rápidos com MySQL e Redis locais.
  ##############################################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: borurio
    password: H4ck3r123

###############################################################################################
# SERVIDOR WEB – Porta interna padrão
# ---------------------------------------------------------------------------------------------
# A porta interna 8080 é mapeada externamente via Docker Compose conforme o ambiente:
#   - Dev: 8081 → 8080
#   - Hom: 8281 → 8080
#   - Prd: 8282 → 8080
###############################################################################################
server:
  port: 8080
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

###############################################################################################
# LOGGING – Configuração de logs e rastreabilidade
# ---------------------------------------------------------------------------------------------
# Logback padrão, com saída em console e em arquivo local (diretório /logs).
###############################################################################################
logging:
  level:
    root: INFO
    org.springframework: INFO
    org.hibernate: WARN
    br.com.borurio: INFO
  file:
    path: logs/
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

###############################################################################################
# METADADOS DO AMBIENTE E INFORMAÇÕES DO PROJETO
###############################################################################################
app:
  name: Borurio ERP Fiscal BR
  version: ${project.version:1.0.0}
  description: "Arquivo principal que define o profile ativo e delega às configurações específicas (dev, hom, prd)."
  owner: "Bruno Ribeiro – DevSecOps / Fullstack Java"

###############################################################################################
# NOTAS TÉCNICAS
# ---------------------------------------------------------------------------------------------
# - Este arquivo é o entrypoint de configuração do Spring Boot.
# - application-dev.yml, application-hom.yml e application-prd.yml contêm as definições detalhadas.
# - Perfis disponíveis: dev | hom | prd.
#
# EXECUÇÃO LOCAL:
#   mvn spring-boot:run "-Dspring-boot.run.profiles=prd"
#
# EXECUÇÃO DOCKER (PRODUÇÃO):
#   docker-compose -f "docker-compose.prd.yml" up -d --build
#
# STACK COMPLETA:
#   Spring Boot 3.3.x | Java 17 | MySQL 8.4 | Redis 7.2 | SEFAZ-SP NF-e 4.00
#
# PADRÕES DE PROJETO:
#   - Clean Architecture
#   - DevSecOps (build multi-stage)
#   - Logs rastreáveis e normalizados
###############################################################################################
