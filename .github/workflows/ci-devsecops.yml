# =============================================================================
# WORKFLOW CI - BUILD E SEGURANÇA (DEVSECOPS)
# Projeto: Borurio ERP Fiscal BR
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# =============================================================================
# Objetivo:
#   - Compilar e testar o ERP Fiscal BR (Java 17 / Spring Boot 3.3.x)
#   - Executar varredura de vulnerabilidades (OWASP Dependency Check)
#   - Publicar relatórios de build e segurança como artefatos do pipeline
#
# Disparo:
#   - Push ou Pull Request nos branches main e dev
# =============================================================================

name: CI - Build e Segurança

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: 17
  MAVEN_CLI_OPTS: "-B -ntp -Dmaven.test.failure.ignore=true"

jobs:
  build:
    name: Build, Testes e Varredura OWASP
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Etapa 1 — Clonar o repositório completo
      # -----------------------------------------------------------------------
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Histórico completo para análise de dependências

      # -----------------------------------------------------------------------
      # Etapa 2 — Configurar Java 17 (Temurin)
      # -----------------------------------------------------------------------
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      # -----------------------------------------------------------------------
      # Etapa 3 — Compilação e Testes (JUnit 5)
      # -----------------------------------------------------------------------
      - name: Compilar e executar testes
        run: |
          echo "🚀 Iniciando build e testes unitários..."
          mvn clean verify ${{ env.MAVEN_CLI_OPTS }} -DskipTests=false
          echo "✅ Compilação e testes concluídos."

      # -----------------------------------------------------------------------
      # Etapa 4 — Varredura de Segurança OWASP (Dependency Check)
      # -----------------------------------------------------------------------
      - name: Executar OWASP Dependency Check
        run: |
          echo "🛡️ Iniciando varredura de dependências OWASP..."
          mvn org.owasp:dependency-check-maven:9.0.9:check \
              -Dnvd.api.disabled=true \
              -Danalyzer.failOnError=false \
              -DfailBuildOnCVSS=11 \
              -Dformat=ALL \
              -Ddata.directory=dependency-check-data
          echo "🧾 Varredura concluída — relatórios disponíveis em target/dependency-check-report/"

      # -----------------------------------------------------------------------
      # Etapa 5 — Arquivar Relatórios OWASP (HTML, XML, JSON)
      # -----------------------------------------------------------------------
      - name: Arquivar relatórios OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp
          path: |
            **/target/dependency-check-report*.html
            **/target/dependency-check-report*.xml
            **/target/dependency-check-report*.json
          if-no-files-found: ignore

      # -----------------------------------------------------------------------
      # Etapa 6 — Publicar Sumário no GitHub Actions
      # -----------------------------------------------------------------------
      - name: Exibir status final do pipeline
        if: always()
        run: |
          echo "========================================================="
          echo "Pipeline CI - Build e Segurança finalizado com sucesso."
          echo "Relatórios OWASP disponíveis como artefato: relatorio-owasp"
          echo "========================================================="
