name: CI - Build e Segurança

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compilar e testar
        run: mvn clean verify -B

      - name: Varredura OWASP Dependency Check
        run: mvn org.owasp:dependency-check-maven:8.2.1:check -Dnvd.api.disabled=true

      - name: Arquivar relatórios de vulnerabilidades
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp
          path: target/dependency-check-report/
