# =============================================================================
# Workflow CI - Build e Segurança
# Projeto: Borurio ERP Fiscal BR
# Objetivo: Compilar, testar e realizar varredura OWASP Dependency Check
# Ambiente: GitHub Actions (Ubuntu Latest)
# =============================================================================

name: CI - Build e Segurança

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  contents: read
  security-events: write

jobs:
  build:
    name: Build, Testes e Segurança
    runs-on: ubuntu-latest

    steps:
      # -----------------------------------------------------------------------
      # Etapa 1 - Clonar o repositório
      # -----------------------------------------------------------------------
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # obtém histórico completo para análise de segurança

      # -----------------------------------------------------------------------
      # Etapa 2 - Configurar Java 17
      # -----------------------------------------------------------------------
      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      # -----------------------------------------------------------------------
      # Etapa 3 - Compilar e executar testes (JUnit 5)
      # -----------------------------------------------------------------------
      - name: Compilar e testar
        run: |
          mvn clean verify \
              -DskipTests=false \
              -Dmaven.test.failure.ignore=true \
              -B

      # -----------------------------------------------------------------------
      # Etapa 4 - Varredura de vulnerabilidades (OWASP Dependency Check)
      # -----------------------------------------------------------------------
      - name: Varredura OWASP Dependency Check (modo seguro)
        run: |
          mvn org.owasp:dependency-check-maven:8.2.1:check \
              -Dnvd.api.disabled=true \
              -Danalyzer.failOnError=false \
              -DfailBuildOnCVSS=11 \
              -Dformat=ALL \
              -Ddata.directory=dependency-check-data

      # -----------------------------------------------------------------------
      # Etapa 5 - Arquivar relatórios gerados
      # -----------------------------------------------------------------------
      - name: Arquivar relatórios de vulnerabilidades
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp
          path: target/dependency-check-report/

      # -----------------------------------------------------------------------
      # Etapa 6 - Logs de conclusão
      # -----------------------------------------------------------------------
      - name: Exibir status final
        if: always()
        run: |
          echo "Pipeline finalizado."
          echo "Relatórios disponíveis no artefato: relatorio-owasp"
