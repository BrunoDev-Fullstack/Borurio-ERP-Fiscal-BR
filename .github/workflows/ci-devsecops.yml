name: CI - Build e Segurança

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build, Testes e Segurança
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Compilar e testar
        run: mvn clean verify -DskipTests=false -B

      - name: Varredura OWASP Dependency Check
        continue-on-error: true
        run: |
          mvn org.owasp:dependency-check-maven:8.2.1:check \
            -Dnvd.api.disabled=true \
            -Danalyzer.failOnError=false \
            -DfailBuildOnCVSS=11 \
            -Dformat=HTML \
            -Ddata.directory=dependency-check-data

      - name: Arquivar relatório OWASP
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-owasp
          if-no-files-found: ignore
          path: |
            **/dependency-check-report.html
            **/dependency-check-report.xml

      - name: Exibir status final
        if: always()
        run: echo "CI finalizado."