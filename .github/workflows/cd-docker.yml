name: CD - Homologação Manual

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-homologacao:
    name: Build de Homologação
    runs-on: ubuntu-latest
    environment: homologacao

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Empacotar aplicação
        run: mvn clean package -DskipTests=true -B

      - name: Instalar Docker e Docker Compose
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io docker-compose
          docker --version
          docker-compose --version

      - name: Construir imagens Docker de homologação
        run: docker-compose -f docker/docker-compose.dev.yml build --no-cache

      - name: Subir stack de homologação
        run: |
          docker-compose -f docker/docker-compose.dev.yml up -d
          docker ps -a

      - name: Exibir logs do ambiente
        if: always()
        run: docker-compose -f docker/docker-compose.dev.yml logs --no-color || true

      - name: Arquivar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-homologacao
          path: /var/lib/docker/containers/