# =============================================================================
# WORKFLOW CD - DEPLOY AUTOMATIZADO MULTIAMBIENTE
# Projeto: Borurio ERP Fiscal BR
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# =============================================================================
# Objetivo:
#   - Compilar e empacotar o ERP Fiscal (Java 17 / Spring Boot 3.3.x)
#   - Construir imagens Docker multi-módulo
#   - Subir containers em ambientes DEV (Homologação) e PRD (Produção)
#
# Disparo:
#   - push para os branches main (PRD) e dev (Homologação)
#   - manual via workflow_dispatch
# =============================================================================

name: CD - Deploy Automatizado Multiambiente

on:
  push:
    branches: [ main, dev ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

env:
  JAVA_VERSION: 17
  MAVEN_OPTS: "-DskipTests=true -B -ntp"

jobs:
  # ---------------------------------------------------------------------------
  # DEPLOY — AMBIENTE DE HOMOLOGAÇÃO (DEV)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy em Ambiente de Homologação (DEV)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar módulos (DEV)
        run: mvn clean package ${{ env.MAVEN_OPTS }}

      - name: Instalar Docker e Docker Compose
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y docker.io docker-compose
          sudo systemctl start docker
          docker --version
          docker-compose --version

      - name: Construir imagens Docker (DEV)
        run: docker-compose -f docker/docker-compose.dev.yml build --no-cache

      - name: Subir containers DEV
        run: |
          docker-compose -f docker/docker-compose.dev.yml up -d
          docker ps -a

      - name: Verificar logs do container WEB (DEV)
        run: docker logs borurio-web-dev || true

      - name: Exportar logs do ambiente DEV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-dev
          path: /var/lib/docker/containers/

  # ---------------------------------------------------------------------------
  # DEPLOY — AMBIENTE DE PRODUÇÃO (PRD)
  # ---------------------------------------------------------------------------
  deploy-prd:
    name: Deploy em Ambiente de Produção (PRD)
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven

      - name: Compilar módulos (PRD)
        run: mvn clean package ${{ env.MAVEN_OPTS }}

      - name: Instalar Docker e Docker Compose
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y docker.io docker-compose
          sudo systemctl start docker
          docker --version
          docker-compose --version

      - name: Construir imagens Docker (PRD)
        run: docker-compose -f docker/docker-compose.yml build --no-cache

      - name: Subir containers PRD
        run: |
          docker-compose -f docker/docker-compose.yml up -d
          docker ps -a

      - name: Verificar logs do container WEB (PRD)
        run: docker logs borurio-web || true

      - name: Exportar logs do ambiente PRD
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-prd
          path: /var/lib/docker/containers/
