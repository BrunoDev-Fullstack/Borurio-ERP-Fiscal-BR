# ==============================================================================
# DOCKER COMPOSE - AMBIENTE PRD / PRODUÇÃO REAL
# ==============================================================================
# Projeto: Borurio ERP Fiscal BR
# Autor: Bruno Ribeiro — Fullstack / DevSecOps
# Revisão: 04/12/2025
# ==============================================================================

version: "3.9"

services:

  # ----------------------------------------------------------------------------
  # MYSQL – BANCO DE DADOS PRODUÇÃO
  # ----------------------------------------------------------------------------
  borurio-mysql-prd:
    image: mysql:8.4
    container_name: borurio-mysql-prd
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_fiscal_prd}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-H4ck3r123}
      TZ: America/Sao_Paulo
    ports:
      - "3308:3306"
    volumes:
      - mysql_prd_data:/var/lib/mysql:rw
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net-prd
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s


  # ----------------------------------------------------------------------------
  # REDIS – CACHE PRODUÇÃO
  # ----------------------------------------------------------------------------
  borurio-redis-prd:
    image: redis:7.2
    container_name: borurio-redis-prd
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_prd_data:/data:rw
    networks:
      - borurio-net-prd
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s


  # ----------------------------------------------------------------------------
  # MINIO – ARMAZENAMENTO DE XMLs, CERTIFICADOS ENVIADOS E BACKUPS
  # ----------------------------------------------------------------------------
  borurio-minio-prd:
    image: minio/minio:latest
    container_name: borurio-minio-prd
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-borurio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-borurio@prd2025}
      TZ: America/Sao_Paulo
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_prd_data:/data:rw
    networks:
      - borurio-net-prd
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s


  # ----------------------------------------------------------------------------
  # BORURIO-WEB — API PRINCIPAL (CORE + APP + FISCAL)
  # ----------------------------------------------------------------------------
  borurio-web-prd:
    build:
      context: ../
      dockerfile: ./Dockerfile
    image: borurio-web-prd:latest
    container_name: borurio-web-prd
    restart: unless-stopped

    depends_on:
      borurio-mysql-prd:
        condition: service_healthy
      borurio-redis-prd:
        condition: service_healthy
      borurio-minio-prd:
        condition: service_healthy

    environment:
      SPRING_PROFILES_ACTIVE: prd

      # BANCO PRD
      SPRING_DATASOURCE_URL: jdbc:mysql://borurio-mysql-prd:3306/borurio_fiscal_prd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: borurio
      SPRING_DATASOURCE_PASSWORD: H4ck3r123

      # REDIS PRD
      SPRING_REDIS_HOST: borurio-redis-prd
      SPRING_REDIS_PORT: 6379

      # SEFAZ PRD - tpAmb=1
      FISCAL_AMBIENTE: 1

      # CERTIFICADO DIGITAL A1 (PKCS12)
      CERT_PATH: /app/certificados/pfx/certificado-jcho-keystore.p12
      CERT_PASS: Jcho@2025!

      TZ: America/Sao_Paulo

      # ACTUATOR
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "never"
      MANAGEMENT_SERVER_PORT: 8281

    ports:
      - "8282:8080"   # API pública
      - "8281:8281"   # Actuator restrito

    volumes:
      # Certificados
      - ../certificados/pfx:/app/certificados/pfx:ro

      # Logs persistentes
      - ../logs:/var/log/borurio:rw

      # Cache Maven
      - ~/.m2:/root/.m2:rw

    networks:
      - borurio-net-prd

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 45s
      timeout: 10s
      retries: 5
      start_period: 60s


# ----------------------------------------------------------------------------
# VOLUMES E REDE
# ----------------------------------------------------------------------------

volumes:
  mysql_prd_data:
  redis_prd_data:
  minio_prd_data:

networks:
  borurio-net-prd:
    driver: bridge
