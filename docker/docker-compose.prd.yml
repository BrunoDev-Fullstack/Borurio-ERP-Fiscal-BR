# ==============================================================================
# DOCKER COMPOSE - AMBIENTE PRD / PRODUÇÃO REAL
# ==============================================================================
# Projeto: Borurio ERP Fiscal BR
# Padrão: Monólito Modular (Web inclui Core, App e Fiscal)
# Stack: Java 17 | Spring Boot 3.3.x | MySQL 8.4 | Redis 7.2 | MinIO
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# Última revisão: 16/12/2025
# ==============================================================================
# Objetivo:
# Ambiente de produção destinado à emissão e auditoria de NF-e reais (tpAmb=1),
# integrado com SEFAZ-SP, ICP-Brasil e preparado para operação 24x7.
# ==============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MYSQL – BANCO DE DADOS (Produção)
  # ---------------------------------------------------------------------------
  borurio-mysql-prd:
    image: mysql:8.4
    container_name: borurio-mysql-prd
    restart: unless-stopped
    env_file:
      - ./env/.env.prd
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3308:3306"
    volumes:
      - mysql_prd_data:/var/lib/mysql:rw
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net-prd
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 20s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # REDIS – CACHE E SESSÕES (Produção)
  # ---------------------------------------------------------------------------
  borurio-redis-prd:
    image: redis:7.2
    container_name: borurio-redis-prd
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_prd_data:/data:rw
    networks:
      - borurio-net-prd
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MINIO – ARMAZENAMENTO DE XMLs, LOGS E BACKUPS
  # ---------------------------------------------------------------------------
  borurio-minio-prd:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: borurio-minio-prd
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.prd
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_prd_data:/data:rw
    networks:
      - borurio-net-prd
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 25s

  # ---------------------------------------------------------------------------
  # WEB – API PRINCIPAL (Core + App + Fiscal)
  # ---------------------------------------------------------------------------
  borurio-web-prd:
    build:
      context: ../
      dockerfile: ./Dockerfile
    image: borurio-web-prd:latest
    container_name: borurio-web-prd
    restart: unless-stopped

    depends_on:
      borurio-mysql-prd:
        condition: service_healthy
      borurio-redis-prd:
        condition: service_healthy
      borurio-minio-prd:
        condition: service_healthy

    env_file:
      - ./env/.env.prd

    environment:
      SPRING_PROFILES_ACTIVE: prd
      TZ: America/Sao_Paulo

      SPRING_DATASOURCE_URL: jdbc:mysql://borurio-mysql-prd:3306/borurio_fiscal_prd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_REDIS_HOST: borurio-redis-prd
      SPRING_REDIS_PORT: 6379

      FISCAL_AMBIENTE: 1

      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_SERVER_PORT: 8281

    ports:
      - "8282:8080"
      - "8281:8281"

    networks:
      - borurio-net-prd

    volumes:
      - ./certs:/app/certs:ro
      - ../logs:/var/log/borurio:rw
      - ~/.m2:/root/.m2:rw

    command: ["sh", "-c", "java $JAVA_TOOL_OPTIONS -jar borurio-web.jar"]

    security_opt:
      - no-new-privileges:true
    tty: true
    stdin_open: true

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8281/actuator/health || exit 1"]
      interval: 45s
      timeout: 10s
      retries: 5
      start_period: 60s

# ---------------------------------------------------------------------------
# VOLUMES PERSISTENTES
# ---------------------------------------------------------------------------
volumes:
  mysql_prd_data:
  redis_prd_data:
  minio_prd_data:
  logs_prd:

# ---------------------------------------------------------------------------
# REDE
# ---------------------------------------------------------------------------
networks:
  borurio-net-prd:
    driver: bridge
