# =============================================================================
# Docker Compose - Ambiente DEV / Homologação
# Projeto: Borurio ERP Fiscal BR
# Padrão: Monólito Modular (Web inclui Core, App e Fiscal)
# Stack: Java 17 | Spring Boot 3.3.x | MySQL 8.4 | Redis 7.2 | MinIO | Mailpit
# =============================================================================
# Objetivo:
# Este ambiente local é destinado para desenvolvimento e testes funcionais.
# Ele provê todos os serviços necessários (MySQL, Redis, MinIO, Mailpit)
# e executa a aplicação principal "borurio-web-dev", que integra Core, App e Fiscal.
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MySQL - Banco de Dados Local (Desenvolvimento)
  # ---------------------------------------------------------------------------
  borurio-mysql-dev:
    image: mysql:8.4
    container_name: borurio-mysql-dev
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SENHA_NOVA_DO_ROOT}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_fiscal_dev}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-H4ck3r123}
      TZ: America/Sao_Paulo
    ports:
      - "3307:3306"  # Porta local ajustada para não conflitar com MySQL de produção
    volumes:
      - ./mysql/data-dev:/var/lib/mysql:rw
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  # ---------------------------------------------------------------------------
  # Redis - Cache e Sessões Locais
  # ---------------------------------------------------------------------------
  borurio-redis-dev:
    image: redis:7.2
    container_name: borurio-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - ./redis/data-dev:/data:rw
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MinIO - Armazenamento Local Compatível com S3
  # ---------------------------------------------------------------------------
  borurio-minio-dev:
    image: minio/minio:latest
    container_name: borurio-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.dev
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin123}
      TZ: America/Sao_Paulo
    ports:
      - "9000:9000"  # API S3
      - "9001:9001"  # Console Web
    volumes:
      - ./minio/data-dev:/data:rw
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Mailpit - SMTP e Painel Web (Testes de E-mail)
  # ---------------------------------------------------------------------------
  borurio-mailpit-dev:
    image: axllent/mailpit:latest
    container_name: borurio-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025"  # Porta SMTP local
      - "8025:8025"  # Painel Web (visualização de mensagens)
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 1025 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    # Utilizado para capturar e visualizar e-mails enviados pela aplicação durante testes.

  # ---------------------------------------------------------------------------
  # Web (API Principal + Módulos Core / App / Fiscal)
  # ---------------------------------------------------------------------------
  borurio-web-dev:
    build:
      context: ../
      dockerfile: ./borurio-web/Dockerfile
    container_name: borurio-web-dev
    restart: unless-stopped
    depends_on:
      borurio-mysql-dev:
        condition: service_healthy
      borurio-redis-dev:
        condition: service_healthy
      borurio-mailpit-dev:
        condition: service_healthy
      borurio-minio-dev:
        condition: service_healthy
    env_file:
      - ./env/.env.dev
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SPRING_DATASOURCE_URL: jdbc:mysql://borurio-mysql-dev:3306/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: borurio
      SPRING_DATASOURCE_PASSWORD: H4ck3r123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      REDIS_HOST: borurio-redis-dev
      REDIS_PORT: 6379
      TZ: America/Sao_Paulo
    ports:
      - "8081:8080"  # Porta da aplicação (8081 externa -> 8080 interna)
    networks:
      - borurio-net-dev
    volumes:
      - ~/.m2:/root/.m2:rw
      - ../borurio-web/target:/app/target:ro
      - ./logs:/var/log/borurio:rw
    command: ["java", "-jar", "/app/target/borurio-web-1.0.0.jar"]
    security_opt:
      - no-new-privileges:true
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health || exit 1"]
      interval: 25s
      timeout: 8s
      retries: 5
      start_period: 40s
    # API principal do ERP Fiscal, responsável por expor endpoints REST,
    # processar NF-e, controlar o fluxo fiscal e integrar com a SEFAZ-SP (mock ou real).

# =============================================================================
# Volumes e Rede de Desenvolvimento
# =============================================================================
volumes:
  mysql_dev_data:
  redis_dev_data:
  minio_dev_data:
  logs:

networks:
  borurio-net-dev:
    driver: bridge
