###################################################################################################
# DOCKER COMPOSE — AMBIENTE DEV / HOM
# Projeto: Borurio ERP Fiscal BR
# Autor: Bruno Ribeiro — DevSecOps / Fullstack Java
#
# Observações:
# - A aplicação (borurio-web) sobe via IntelliJ
# - Docker é usado apenas para infraestrutura (MySQL, Redis, MinIO, Mailpit)
###################################################################################################

services:

  #################################################################################################
  # MYSQL — BANCO DE DADOS DEV
  #################################################################################################
  borurio-mysql-dev:
    image: mysql:8.4
    container_name: borurio-mysql-dev
    restart: unless-stopped
    env_file:
      - ./env/.env.dev
    ports:
      - "3307:3306"
    volumes:
      - mysql_dev_data:/var/lib/mysql:rw
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  #################################################################################################
  # REDIS — CACHE / SESSÕES
  #################################################################################################
  borurio-redis-dev:
    image: redis:7.2
    container_name: borurio-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data:rw
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  #################################################################################################
  # MINIO — STORAGE COMPATÍVEL COM S3 (DEV SINGLE-NODE)
  #################################################################################################
  borurio-minio-dev:
    image: minio/minio:RELEASE.2023-09-04T19-57-37Z
    container_name: borurio-minio-dev
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.dev
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./minio/data-dev:/data:rw
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true

  #################################################################################################
  # MAILPIT — CAPTURA DE E-MAILS (DEV)
  #################################################################################################
  borurio-mailpit-dev:
    image: axllent/mailpit:latest
    container_name: borurio-mailpit-dev
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - borurio-net-dev
    security_opt:
      - no-new-privileges:true

  #################################################################################################
  # APLICAÇÃO WEB — DEFINIDA MAS NÃO USADA NO DEV
  #################################################################################################
  borurio-web-dev:
    image: borurio-web-dev:latest
    container_name: borurio-web-dev
    restart: "no"
    profiles:
      - disabled
    networks:
      - borurio-net-dev

###################################################################################################
# VOLUMES
###################################################################################################
volumes:
  mysql_dev_data:
  redis_dev_data:

###################################################################################################
# NETWORK
###################################################################################################
networks:
  borurio-net-dev:
    driver: bridge
