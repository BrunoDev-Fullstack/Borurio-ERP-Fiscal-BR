version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MySQL (DEV)
  # ---------------------------------------------------------------------------
  borurio-mysql-dev:
    image: mysql:8.4
    container_name: borurio-mysql-dev
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: SENHA_NOVA_DO_ROOT
      MYSQL_DATABASE: borurio_fiscal_dev
      MYSQL_USER: borurio
      MYSQL_PASSWORD: H4ck3r123
      TZ: America/Sao_Paulo

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

    ports:
      - "3307:3306"

    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pSENHA_NOVA_DO_ROOT --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  # ---------------------------------------------------------------------------
  # MinIO (DEV)
  # ---------------------------------------------------------------------------
  borurio-minio-dev:
    image: minio/minio:latest
    container_name: borurio-minio-dev
    restart: unless-stopped

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
      TZ: America/Sao_Paulo

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_dev_data:/data

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4


  # ---------------------------------------------------------------------------
  # Aplicação (DEV)
  # ---------------------------------------------------------------------------
  borurio-web-dev:
    build:
      context: ../
      dockerfile: ./Dockerfile

    container_name: borurio-web-dev
    restart: unless-stopped
    init: true

    depends_on:
      borurio-mysql-dev:
        condition: service_healthy

    env_file:
      - ./env/.env.dev

    environment:
      SPRING_PROFILES_ACTIVE: dev

      # Datasource explícito para execução dentro do Docker
      SPRING_DATASOURCE_URL: jdbc:mysql://borurio-mysql-dev:3306/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo&connectTimeout=30000&socketTimeout=60000
      SPRING_DATASOURCE_USERNAME: borurio
      SPRING_DATASOURCE_PASSWORD: H4ck3r123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver

      # MinIO
      MINIO_URL: http://borurio-minio-dev:9000
      MINIO_CONSOLE_URL: http://borurio-minio-dev:9001
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123

      # Fiscal — certificado e emitente (JCHO GLOBAL LTDA, CN do cert A1)
      FISCAL_AMBIENTE: 2
      FISCAL_CERT_PATH: /app/certificados/pfx/certificado-jcho.pfx
      FISCAL_EMITENTE_CNPJ: "54393421000159"
      FISCAL_EMITENTE_RAZAO_SOCIAL: "JCHO GLOBAL LTDA"
      FISCAL_EMITENTE_NOME_FANTASIA: "JCHO GLOBAL"
      FISCAL_EMITENTE_IE: "ISENTO"
      FISCAL_EMITENTE_CRT: "1"
      FISCAL_EMITENTE_LOGRADOURO: "Rua Teste Homologacao"
      FISCAL_EMITENTE_NUMERO: "1"
      FISCAL_EMITENTE_BAIRRO: "Centro"
      FISCAL_EMITENTE_MUNICIPIO: "Sao Paulo"
      FISCAL_EMITENTE_CODIGO_MUNICIPIO: "3550308"
      FISCAL_EMITENTE_UF: "SP"
      FISCAL_EMITENTE_CEP: "01310100"

      TZ: America/Sao_Paulo

    ports:
      - "8080:8080"

    networks:
      - borurio-net-dev

    volumes:
      - ../sql:/app/sql:ro
      - ./certs:/app/certificados:ro
      - logs_dev:/var/log/borurio

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mysql_dev_data:
  minio_dev_data:
  logs_dev:


# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  borurio-net-dev:
    driver: bridge