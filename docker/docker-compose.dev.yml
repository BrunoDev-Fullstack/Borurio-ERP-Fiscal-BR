version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MySQL (DEV)
  # ---------------------------------------------------------------------------
  borurio-mysql-dev:
    image: mysql:8.4
    container_name: borurio-mysql-dev
    restart: unless-stopped

    env_file:
      - ./env/.env.dev

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SENHA_NOVA_DO_ROOT}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_dev}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-H4ck3r123}
      TZ: America/Sao_Paulo

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

    ports:
      - "3307:3306"

    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s


  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  borurio-redis-dev:
    image: redis:7.2
    container_name: borurio-redis-dev
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_dev_data:/data

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6


  # ---------------------------------------------------------------------------
  # MinIO
  # ---------------------------------------------------------------------------
  borurio-minio-dev:
    image: minio/minio:latest
    container_name: borurio-minio-dev
    restart: unless-stopped

    command: server /data --console-address ":9001"

    env_file:
      - ./env/.env.dev

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_dev_data:/data

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4


  # ---------------------------------------------------------------------------
  # Aplicação
  # ---------------------------------------------------------------------------
  borurio-web-dev:
    build:
      context: ../
      dockerfile: ./Dockerfile

    container_name: borurio-web-dev
    restart: unless-stopped
    init: true

    depends_on:
      borurio-mysql-dev:
        condition: service_healthy
      borurio-redis-dev:
        condition: service_healthy

    env_file:
      - ./env/.env.dev

    environment:
      SPRING_PROFILES_ACTIVE: dev

      # BANCO (PADRÃO ÚNICO - SEM AMBIGUIDADE)
      DB_HOST: borurio-mysql-dev
      DB_PORT: 3306
      DB_NAME: borurio_dev
      DB_USER: borurio
      DB_PASS: H4ck3r123

      # REDIS
      REDIS_HOST: borurio-redis-dev
      REDIS_PORT: 6379

      # FISCAL
      FISCAL_AMBIENTE: 2

      TZ: America/Sao_Paulo

    ports:
      - "8080:8080"

    networks:
      - borurio-net-dev

    volumes:
      - ../sql:/app/sql:ro
      - ./certs:/app/certificados:ro
      - logs_dev:/var/log/borurio

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s


# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  mysql_dev_data:
  redis_dev_data:
  minio_dev_data:
  logs_dev:


# ---------------------------------------------------------------------------
# Network
# ---------------------------------------------------------------------------
networks:
  borurio-net-dev:
    driver: bridge