# =============================================================================
# Docker Compose - DEV
# Projeto: Borurio ERP Fiscal BR
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MySQL (DEV)
  # ---------------------------------------------------------------------------
  borurio-mysql-dev:
    image: mysql:8.4
    container_name: borurio-mysql-dev
    restart: unless-stopped

    env_file:
      - ./env/.env.dev

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SENHA_NOVA_DO_ROOT}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_dev}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-H4ck3r123}
      TZ: America/Sao_Paulo

    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci

    ports:
      - "3307:3306"

    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  borurio-redis-dev:
    image: redis:7.2
    container_name: borurio-redis-dev
    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_dev_data:/data

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MinIO
  # ---------------------------------------------------------------------------
  borurio-minio-dev:
    image: minio/minio:latest
    container_name: borurio-minio-dev
    restart: unless-stopped

    command: server /data --console-address ":9001"

    env_file:
      - ./env/.env.dev

    environment:
      TZ: America/Sao_Paulo

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_dev_data:/data

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Aplicação
  # ---------------------------------------------------------------------------
  borurio-web-dev:
    build:
      context: ../
      dockerfile: ./Dockerfile

    container_name: borurio-web-dev
    restart: unless-stopped
    init: true

    depends_on:
      borurio-mysql-dev:
        condition: service_healthy
      borurio-redis-dev:
        condition: service_healthy
      borurio-minio-dev:
        condition: service_healthy

    env_file:
      - ./env/.env.dev

    environment:
      SPRING_PROFILES_ACTIVE: dev

      SPRING_DATASOURCE_URL: jdbc:mysql://borurio-mysql-dev:3306/borurio_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: borurio
      SPRING_DATASOURCE_PASSWORD: H4ck3r123

      SPRING_REDIS_HOST: borurio-redis-dev
      SPRING_REDIS_PORT: 6379

      FISCAL_AMBIENTE: 2
      TZ: America/Sao_Paulo

      MANAGEMENT_SERVER_PORT: 8081

    ports:
      - "8080:8080"
      - "8081:8081"

    networks:
      - borurio-net-dev

    volumes:
      - ../sql:/app/sql:ro
      - ../certificados:/app/certificados:ro
      - logs_dev:/var/log/borurio

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mysql_dev_data:
  redis_dev_data:
  minio_dev_data:
  logs_dev:

# =============================================================================
# Network
# =============================================================================
networks:
  borurio-net-dev:
    driver: bridge