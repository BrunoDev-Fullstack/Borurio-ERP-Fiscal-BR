# =============================================================================
# DOCKER COMPOSE — AMBIENTE DE HOMOLOGAÇÃO (SEFAZ-SP)
# Projeto: Borurio ERP Fiscal BR
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# Data: 23/10/2025
# =============================================================================
# Estrutura: Monólito Modular (borurio-web + core + app + fiscal)
# Objetivo: Testes de integração real com SEFAZ-SP (Homologação)
# =============================================================================
version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MYSQL — Banco de Dados Homologação
  # ---------------------------------------------------------------------------
  mysql:
    container_name: borurio-mysql-hom
    image: mysql:8.4
    restart: unless-stopped
    ports:
      - "3310:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-SENHA_NOVA_DO_ROOT}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_fiscal_hom}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-H4ck3r123}
      TZ: America/Sao_Paulo
    volumes:
      - mysql_hom_data:/var/lib/mysql:rw
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 25s
    networks:
      - borurio-net-hom
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # REDIS — Cache e Sessões
  # ---------------------------------------------------------------------------
  redis:
    container_name: borurio-redis-hom
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_hom_data:/data:rw
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    networks:
      - borurio-net-hom
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # BORURIO-WEB — Aplicação Principal (API REST + Actuator + Swagger)
  # ---------------------------------------------------------------------------
  web:
    container_name: borurio-web-hom
    build:
      context: ../                         # Contexto: raiz do monorepo
      dockerfile: ./borurio-web/Dockerfile
    restart: unless-stopped
    ports:
      - "8282:8282"   # API principal (Controllers, Swagger)
      - "8283:8283"   # Actuator / Health / Metrics
    env_file:
      - ./env/.env.hom
    environment:
      SPRING_PROFILES_ACTIVE: hom
      TZ: America/Sao_Paulo
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: ${MYSQL_USER:-borurio}
      DB_PASS: ${MYSQL_PASSWORD:-H4ck3r123}
      REDIS_HOST: redis
      REDIS_PORT: 6379

      # URLs SEFAZ Homologação (necessárias para placeholders Spring)
      BORURIO_SEFAZ_URLAUTORIZACAO: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx"
      BORURIO_SEFAZ_URLRETAUTORIZACAO: "https://homologacao.nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx"

      # Força leitura explícita do YAML no classpath
      JAVA_OPTS: "-Dspring.config.additional-location=classpath:/application-hom.yml"
    volumes:
      # Certificado Digital A1 (.pfx) do módulo fiscal
      - ../borurio-fiscal/src/main/resources/certs:/app/certs:ro

      # Logs e cache Maven compartilhado
      - ./logs:/app/logs:rw
      - ~/.m2:/root/.m2:rw
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - borurio-net-hom
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8283/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    security_opt:
      - no-new-privileges:true

  # ---------------------------------------------------------------------------
  # BORURIO-FISCAL — Módulo NF-e (Build e Testes SEFAZ-SP)
  # ---------------------------------------------------------------------------
  fiscal:
    container_name: borurio-fiscal-hom
    build:
      context: ../
      dockerfile: ./borurio-fiscal/Dockerfile
    restart: "no"
    env_file:
      - ./env/.env.hom
    depends_on:
      mysql:
        condition: service_healthy
    command: ["echo", "Container fiscal buildado para testes unitários e integração SEFAZ-SP"]
    networks:
      - borurio-net-hom
    security_opt:
      - no-new-privileges:true

# =============================================================================
# REDE E VOLUMES
# =============================================================================
networks:
  borurio-net-hom:
    driver: bridge

volumes:
  mysql_hom_data:
  redis_hom_data:
  logs:
