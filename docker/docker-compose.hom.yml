services:

  borurio-mysql-hom:
    image: mysql:8.4
    container_name: borurio-mysql-hom
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: SENHA_NOVA_DO_ROOT
      MYSQL_DATABASE: borurio_fiscal_hom
      MYSQL_USER: borurio
      MYSQL_PASSWORD: H4ck3r123
      TZ: America/Sao_Paulo
    ports:
      - "3317:3306"
    volumes:
      - mysql_hom_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net-hom
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -pSENHA_NOVA_DO_ROOT --silent"]
      interval: 10s
      retries: 8

  borurio-redis-hom:
    image: redis:7.2
    container_name: borurio-redis-hom
    restart: unless-stopped
    ports:
      - "6389:6379"
    volumes:
      - redis_hom_data:/data
    networks:
      - borurio-net-hom
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]

  borurio-minio-hom:
    image: minio/minio:latest
    container_name: borurio-minio-hom
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.hom
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_hom_data:/data
    networks:
      - borurio-net-hom

  borurio-mailpit-hom:
    image: axllent/mailpit:latest
    container_name: borurio-mailpit-hom
    restart: unless-stopped
    ports:
      - "1125:1025"
      - "8125:8025"
    networks:
      - borurio-net-hom

  borurio-web-hom:
    image: borurio-web-hom:latest
    container_name: borurio-web-hom
    restart: unless-stopped
    depends_on:
      borurio-mysql-hom:
        condition: service_healthy
      borurio-redis-hom:
        condition: service_healthy
    env_file:
      - ./env/.env.hom
    environment:
      SPRING_PROFILES_ACTIVE: hom
      TZ: America/Sao_Paulo

      DB_HOST: borurio-mysql-hom
      DB_PORT: 3306
      DB_NAME: borurio_fiscal_hom
      DB_USER: borurio
      DB_PASS: H4ck3r123

      REDIS_HOST: borurio-redis-hom
      REDIS_PORT: 6379

      JWT_SECRET: borurio-hom-secret-2026

      FISCAL_CERT_PATH: /app/certs/pfx/certificado-jcho.pfx
      FISCAL_CERT_PASS: 2025@Qz1

    ports:
      - "8082:8082"
    volumes:
      - ./certs:/app/certs:ro
      - logs:/var/log/borurio
    networks:
      - borurio-net-hom
    command: ["java", "-jar", "/app/borurio-web.jar"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8082/actuator/health || exit 1"]
      interval: 30s
      retries: 5

volumes:
  mysql_hom_data:
  redis_hom_data:
  minio_hom_data:
  logs:

networks:
  borurio-net-hom:
    driver: bridge
