version: "3.9"

services:

  borurio-mysql-hom:
    image: mysql:8.4
    container_name: borurio-mysql-hom
    restart: unless-stopped

    env_file:
      - ./env/.env.hom

    environment:
      MYSQL_DATABASE: borurio_fiscal_hom
      TZ: America/Sao_Paulo

    ports:
      - "3317:3306"

    volumes:
      - mysql_hom_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - borurio-net-hom

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s


  borurio-redis-hom:
    image: redis:7.2
    container_name: borurio-redis-hom
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "6389:6379"

    volumes:
      - redis_hom_data:/data

    networks:
      - borurio-net-hom

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


  borurio-minio-hom:
    image: minio/minio:latest
    container_name: borurio-minio-hom
    restart: unless-stopped

    command: server /data --console-address ":9001"

    env_file:
      - ./env/.env.hom

    ports:
      - "9100:9000"
      - "9101:9001"

    volumes:
      - minio_hom_data:/data

    networks:
      - borurio-net-hom

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4


  borurio-mailpit-hom:
    image: axllent/mailpit:latest
    container_name: borurio-mailpit-hom
    restart: unless-stopped

    ports:
      - "1125:1025"
      - "8125:8025"

    networks:
      - borurio-net-hom


  borurio-web-hom:
    build:
      context: ../
      dockerfile: ./Dockerfile

    image: borurio-web-hom:latest
    container_name: borurio-web-hom
    restart: unless-stopped

    depends_on:
      borurio-mysql-hom:
        condition: service_healthy
      borurio-redis-hom:
        condition: service_healthy

    env_file:
      - ./env/.env.hom

    environment:
      SPRING_PROFILES_ACTIVE: hom
      FISCAL_AMBIENTE: 2

      # REDIS (EXPLÍCITO - REMOVE AMBIGUIDADE)
      REDIS_HOST: borurio-redis-hom
      REDIS_PORT: 6379

      # DB (EXPLÍCITO)
      DB_HOST: borurio-mysql-hom
      DB_PORT: 3306

      # FAIL-FAST
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET_NOT_DEFINED}

    ports:
      - "8081:8081"

    networks:
      - borurio-net-hom

    volumes:
      - ./certs:/app/certs:ro
      - logs:/var/log/borurio

    command: >
      sh -c "
      echo 'Validando ambiente...';

      if [ -z \"$SECURITY_JWT_SECRET\" ]; then
        echo 'ERRO: JWT não definido'; exit 1; fi;

      if [ -z \"$REDIS_HOST\" ]; then
        echo 'ERRO: REDIS_HOST não definido'; exit 1; fi;

      if [ -z \"$DB_HOST\" ]; then
        echo 'ERRO: DB_HOST não definido'; exit 1; fi;

      echo 'Ambiente OK, iniciando aplicação...';

      java $JAVA_OPTS \
        -Dspring.profiles.active=hom \
        -Dfile.encoding=UTF-8 \
        -Duser.timezone=America/Sao_Paulo \
        -jar borurio-web-1.0.0.jar
      "

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8081/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s


volumes:
  mysql_hom_data:
  redis_hom_data:
  minio_hom_data:
  logs:


networks:
  borurio-net-hom:
    driver: bridge