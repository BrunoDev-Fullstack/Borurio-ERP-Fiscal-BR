version: "3.9"

services:

  borurio-mysql-dev:
    image: mysql:8.4
    container_name: borurio-mysql-dev
    restart: unless-stopped

    env_file:
      - ./env/.env.dev

    environment:
      MYSQL_DATABASE: borurio_dev
      TZ: America/Sao_Paulo

    ports:
      - "3307:3306"

    volumes:
      - mysql_dev_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s


  borurio-redis-dev:
    image: redis:7.2
    container_name: borurio-redis-dev
    restart: unless-stopped

    command: ["redis-server", "--appendonly", "yes"]

    ports:
      - "6379:6379"

    volumes:
      - redis_dev_data:/data

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s


  borurio-minio-dev:
    image: minio/minio:latest
    container_name: borurio-minio-dev
    restart: unless-stopped

    command: server /data --console-address ":9001"

    env_file:
      - ./env/.env.dev

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - minio_dev_data:/data

    networks:
      - borurio-net-dev

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4


  borurio-web-dev:
    build:
      context: ../
      dockerfile: ./Dockerfile

    image: borurio-web-dev:latest
    container_name: borurio-web-dev
    restart: unless-stopped

    depends_on:
      borurio-mysql-dev:
        condition: service_healthy
      borurio-redis-dev:
        condition: service_healthy

    env_file:
      - ./env/.env.dev

    environment:
      SPRING_PROFILES_ACTIVE: dev
      FISCAL_AMBIENTE: 2

      # REDIS (explícito)
      REDIS_HOST: borurio-redis-dev
      REDIS_PORT: 6379

      # DATABASE (explícito)
      DB_HOST: borurio-mysql-dev
      DB_PORT: 3306

      # JWT obrigatório
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET:?SECURITY_JWT_SECRET_NOT_DEFINED}

      TZ: America/Sao_Paulo

    ports:
      - "8080:8080"

    networks:
      - borurio-net-dev

    volumes:
      # certificado exatamente no path esperado pela aplicação
      - ./certs/pfx/certificado-jcho.pfx:/app/certificados/certificado-jcho.pfx:ro

      # logs
      - logs_dev:/var/log/borurio

    command: >
      sh -c "
      echo 'Validando ambiente DEV...';

      if [ -z \"$SECURITY_JWT_SECRET\" ]; then
        echo 'ERRO: JWT não definido'; exit 1; fi;

      if [ -z \"$REDIS_HOST\" ]; then
        echo 'ERRO: REDIS_HOST não definido'; exit 1; fi;

      if [ -z \"$DB_HOST\" ]; then
        echo 'ERRO: DB_HOST não definido'; exit 1; fi;

      echo 'Ambiente DEV OK, iniciando aplicação...';

      java $JAVA_OPTS \
        -Dspring.profiles.active=dev \
        -Dfile.encoding=UTF-8 \
        -Duser.timezone=America/Sao_Paulo \
        -jar /app/app.jar
      "

    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s


volumes:
  mysql_dev_data:
  redis_dev_data:
  minio_dev_data:
  logs_dev:


networks:
  borurio-net-dev:
    driver: bridge