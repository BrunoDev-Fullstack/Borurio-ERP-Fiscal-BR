# ==============================================================================
# DOCKER COMPOSE - BORURIO ERP FISCAL BR
# Ambiente: Produção / Homologação
# ==============================================================================
version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MYSQL – BANCO DE DADOS
  # ---------------------------------------------------------------------------
  borurio-mysql:
    image: mysql:8.4
    container_name: borurio-mysql
    restart: unless-stopped
    env_file:
      - ./env/.env.prd
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_fiscal_prd}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_pass_2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "3308:3306"
    volumes:
      - mysql_data:/var/lib/mysql:rw
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # REDIS
  # ---------------------------------------------------------------------------
  borurio-redis:
    image: redis:7.2
    container_name: borurio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data:rw
    networks:
      - borurio-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MINIO – STORAGE
  # ---------------------------------------------------------------------------
  borurio-minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: borurio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.prd
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-borurio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-borurio@prd2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio_data:/data:rw
    networks:
      - borurio-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 25s

  # ---------------------------------------------------------------------------
  # BORURIO WEB (Core + App + Fiscal)
  # ---------------------------------------------------------------------------
  borurio-web:
    build:
      context: ..
      dockerfile: ./Dockerfile
    image: borurio-web:latest
    container_name: borurio-web
    restart: unless-stopped
    depends_on:
      borurio-mysql:
        condition: service_healthy
      borurio-redis:
        condition: service_healthy
      borurio-minio:
        condition: service_healthy
    env_file:
      - ./env/.env.prd
    environment:
      SPRING_PROFILES_ACTIVE: "prd"
      SPRING_DATASOURCE_URL: "jdbc:mysql://borurio-mysql:3306/borurio_fiscal_prd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo"
      SPRING_DATASOURCE_USERNAME: "borurio"
      SPRING_DATASOURCE_PASSWORD: "H4ck3r123"
      SPRING_REDIS_HOST: "borurio-redis"
      SPRING_REDIS_PORT: 6379
      FISCAL_AMBIENTE: 1
      TZ: America/Sao_Paulo
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_SERVER_PORT: 8281
    ports:
      - "8282:8080"
      - "8281:8281"
    networks:
      - borurio-net
    volumes:
      - ../logs:/var/log/borurio:rw
      - ./certs:/app/certificados:ro
    security_opt:
      - no-new-privileges:true
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 45s
      timeout: 10s
      retries: 5
      start_period: 60s

# ---------------------------------------------------------------------------
# VOLUMES / NETWORK
# ---------------------------------------------------------------------------
volumes:
  mysql_data:
  redis_data:
  minio_data:
  logs:

networks:
  borurio-net:
    driver: bridge
