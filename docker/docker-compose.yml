# ==============================================================================
# DOCKER COMPOSE - BORURIO ERP FISCAL BR
# ==============================================================================
# Ambiente: Produção / Homologação
# Stack oficial dos módulos fiscais e serviços auxiliares
# Padrão: Monólito Modular (Web inclui Core, App e Fiscal)
# Stack: Java 17 | Spring Boot 3.3.x | MySQL 8.4 | Redis 7.2 | MinIO
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# Última revisão: 04/11/2025
# ==============================================================================
# Objetivo:
# Este arquivo define o ambiente de produção ou homologação (tpAmb=1 ou 2)
# para execução do ERP Fiscal Borurio BR, integrando MySQL, Redis, MinIO
# e o módulo unificado borurio-web (que contém Core, App e Fiscal).
# ==============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MYSQL – BANCO DE DADOS RELACIONAL (8.4)
  # ---------------------------------------------------------------------------
  borurio-mysql:
    image: mysql:8.4
    container_name: borurio-mysql
    restart: unless-stopped
    env_file:
      - ./env/.env.prd
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_fiscal_prd}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_pass_2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "3308:3306"   # Porta exposta externamente
    volumes:
      - mysql_data:/var/lib/mysql:rw
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  # ---------------------------------------------------------------------------
  # REDIS – CACHE E SESSÕES (7.2)
  # ---------------------------------------------------------------------------
  borurio-redis:
    image: redis:7.2
    container_name: borurio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data:rw
    networks:
      - borurio-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  # ---------------------------------------------------------------------------
  # MINIO – ARMAZENAMENTO LOCAL (Compatível com S3)
  # ---------------------------------------------------------------------------
  borurio-minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: borurio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.prd
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-borurio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-borurio@prd2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "9002:9000"   # API S3
      - "9003:9001"   # Console Web (administração)
    volumes:
      - minio_data:/data:rw
    networks:
      - borurio-net
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 4
      start_period: 25s

  # ---------------------------------------------------------------------------
  # WEB – API REST PRINCIPAL (Core + App + Fiscal)
  # ---------------------------------------------------------------------------
  borurio-web:
    build:
      context: ..
      dockerfile: ./Dockerfile  # Dockerfile raiz unificado
    image: borurio-web:latest
    container_name: borurio-web
    restart: unless-stopped
    depends_on:
      borurio-mysql:
        condition: service_healthy
      borurio-redis:
        condition: service_healthy
      borurio-minio:
        condition: service_healthy
    env_file:
      - ./env/.env.prd
    environment:
      SPRING_PROFILES_ACTIVE: prd
      SPRING_DATASOURCE_URL: jdbc:mysql://borurio-mysql:3306/borurio_fiscal_prd?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
      SPRING_DATASOURCE_USERNAME: borurio
      SPRING_DATASOURCE_PASSWORD: H4ck3r123
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: com.mysql.cj.jdbc.Driver
      SPRING_REDIS_HOST: borurio-redis
      SPRING_REDIS_PORT: 6379
      FISCAL_AMBIENTE: 1   # tpAmb=1 (Produção SEFAZ-SP) / trocar para 2 em homologação
      TZ: ${TZ:-America/Sao_Paulo}
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: "health,info,metrics"
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: "always"
      MANAGEMENT_SERVER_PORT: 8281
    ports:
      - "8282:8080"   # API REST principal (NF-e / SEFAZ-SP)
      - "8281:8281"   # Actuator restrito (monitoramento)
    networks:
      - borurio-net
    volumes:
      - ../logs:/var/log/borurio:rw              # Logs persistentes
      - ./certs:/app/certificados:ro             # Certificados A1
      - ~/.m2:/root/.m2:rw                       # Cache Maven
    command: ["sh", "-c", "java -jar /app/borurio-web.jar"]
    security_opt:
      - no-new-privileges:true
    tty: true
    stdin_open: true
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/actuator/health || exit 1"]
      interval: 45s
      timeout: 10s
      retries: 5
      start_period: 60s
    # Observações:
    # - Porta 8282: acesso REST principal (NF-e)
    # - Porta 8281: monitoramento interno (Actuator)
    # - Certificado A1: /app/certificados/certificado-prd.pfx
    # - tpAmb=1 (produção SEFAZ-SP), tpAmb=2 (homologação SEFAZ-SP)

# ==============================================================================
# VOLUMES PERSISTENTES E REDE COMPARTILHADA
# ==============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  logs:
    driver: local

networks:
  borurio-net:
    driver: bridge
