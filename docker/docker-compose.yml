# ==============================================================================
# Docker Compose - Borurio ERP Fiscal BR
# Ambiente: Produção / Homologação
# Stack oficial dos módulos fiscais e serviços auxiliares
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# =============================================================================

version: "3.9"

services:

  # ---------------------------------------------------------------------------
  # MySQL - Banco de Dados Relacional (MySQL 8.4)
  # ---------------------------------------------------------------------------
  borurio-mysql:
    image: mysql:8.4
    container_name: borurio-mysql
    restart: unless-stopped
    env_file:
      - ./env/.env.prd
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_fiscal_prd}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_pass_2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "3308:3306"   # Porta alterada para evitar conflito local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - borurio-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis - Cache e Gerenciador de Sessões
  # ---------------------------------------------------------------------------
  borurio-redis:
    image: redis:7.2
    container_name: borurio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - borurio-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO - Armazenamento de Arquivos (S3 compatível)
  # ---------------------------------------------------------------------------
  borurio-minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: borurio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.prd
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-borurio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-borurio@prd2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "9002:9000"   # API S3
      - "9003:9001"   # Console Web
    volumes:
      - minio_data:/data
    networks:
      - borurio-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Web - API REST Principal (ERP Fiscal BR + Fiscal Integrado)
  # ---------------------------------------------------------------------------
  borurio-web:
    build:
      context: ..
      dockerfile: ./Dockerfile    # Build unificado (core + app + fiscal + web)
    container_name: borurio-web-prd
    restart: unless-stopped
    depends_on:
      borurio-mysql:
        condition: service_healthy
      borurio-redis:
        condition: service_healthy
      borurio-minio:
        condition: service_healthy
    env_file:
      - ./env/.env.prd
    environment:
      SPRING_PROFILES_ACTIVE: prd
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "8282:8080"   # Porta principal API REST
      - "8281:8281"   # Porta de monitoramento Actuator
    networks:
      - borurio-net
    volumes:
      - ~/.m2:/root/.m2
      - ../logs:/var/log/borurio
      - ./certs:/app/certificados:ro
    command: ["sh", "-c", "java -jar /app/borurio-web.jar"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8281/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s

# =============================================================================
# Volumes Persistentes e Rede Compartilhada
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  logs:
    driver: local

networks:
  borurio-net:
    driver: bridge
