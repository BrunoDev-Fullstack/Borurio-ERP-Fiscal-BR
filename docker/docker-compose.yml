# =============================================================================
# Docker Compose - Borurio ERP Fiscal BR
# Ambiente: Produção / Homologação
# Stack oficial dos módulos fiscais e serviços auxiliares
# Autor: Bruno Ribeiro — Desenvolvedor Fullstack / DevSecOps
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # MySQL - Banco de Dados Relacional (MySQL 8.4)
  # ---------------------------------------------------------------------------
  borurio-mysql:
    image: mysql:8.4
    container_name: borurio-mysql
    restart: unless-stopped
    env_file:
      - ./env/.env.prd
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-secure_root_2025}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-borurio_fiscal}
      MYSQL_USER: ${MYSQL_USER:-borurio}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-secure_pass_2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "3307:3306"   # Porta alterada para evitar conflito local
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - borurio-net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Redis - Cache e Gerenciador de Sessões
  # ---------------------------------------------------------------------------
  borurio-redis:
    image: redis:7.2
    container_name: borurio-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - borurio-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ---------------------------------------------------------------------------
  # MinIO - Armazenamento de Arquivos (S3 compatível)
  # ---------------------------------------------------------------------------
  borurio-minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: borurio-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file:
      - ./env/.env.prd
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-borurio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-borurio@prd2025}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console Web
    volumes:
      - minio_data:/data
    networks:
      - borurio-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9000/minio/health/live || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Mailpit - SMTP e Painel Web (para homologação)
  # ---------------------------------------------------------------------------
  borurio-mailpit:
    image: axllent/mailpit:latest
    container_name: borurio-mailpit
    restart: unless-stopped
    ports:
      - "2526:1025"  # SMTP local
      - "8026:8025"  # Painel web
    networks:
      - borurio-net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8025/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ---------------------------------------------------------------------------
  # Fiscal - Módulo NF-e e Auditoria Fiscal (Spring Boot 3.3.x)
  # ---------------------------------------------------------------------------
  borurio-fiscal:
    build:
      context: ..
      dockerfile: ./borurio-fiscal/Dockerfile
    container_name: borurio-fiscal-prd
    restart: unless-stopped
    depends_on:
      borurio-mysql:
        condition: service_healthy
      borurio-redis:
        condition: service_healthy
      borurio-minio:
        condition: service_healthy
    env_file:
      - ./env/.env.prd
    environment:
      SPRING_PROFILES_ACTIVE: prd
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "8082:8080"
    networks:
      - borurio-net
    volumes:
      - ~/.m2:/root/.m2
      - ../borurio-fiscal:/app
      - ./certs:/opt/borurio/certs
      - ./logs:/var/log/borurio
    command: ["java", "-jar", "/app/target/borurio-fiscal-1.0.0.jar"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

  # ---------------------------------------------------------------------------
  # Web - API REST Principal (ERP Fiscal BR)
  # ---------------------------------------------------------------------------
  borurio-web:
    build:
      context: ..
      dockerfile: ./borurio-web/Dockerfile
    container_name: borurio-web-prd
    restart: unless-stopped
    depends_on:
      borurio-fiscal:
        condition: service_healthy
      borurio-mailpit:
        condition: service_healthy
    env_file:
      - ./env/.env.prd
    environment:
      SPRING_PROFILES_ACTIVE: prd
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "8080:8080"
    networks:
      - borurio-net
    volumes:
      - ~/.m2:/root/.m2
      - ../borurio-web:/app
      - ./logs:/var/log/borurio
    command: ["java", "-jar", "/app/target/borurio-web-1.0.0.jar"]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/actuator/health || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s

# =============================================================================
# Volumes Persistentes e Rede Compartilhada
# =============================================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local
  logs:
    driver: local

networks:
  borurio-net:
    driver: bridge
