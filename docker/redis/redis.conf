# Configuração do Redis - Borurio ERP Fiscal
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300
daemonize no
supervised no
loglevel notice
databases 16

# Configurações de persistência (Snapshot RDB)
# Salva automaticamente os dados conforme o volume de gravações:
# - A cada 900 segundos (15 min) se houver 1 modificação
# - A cada 300 segundos (5 min) se houver 10 modificações
# - A cada 60 segundos se houver 10.000 modificações
save 900 1
save 300 10
save 60 10000

# Compressão e integridade do arquivo RDB
rdbcompression yes
rdbchecksum yes

# Nome do arquivo de banco de dados e diretório de armazenamento
dbfilename dump.rdb
dir /data

# Ajustes de segurança e desempenho
# Política de remoção: remove chaves menos utilizadas quando atingir o limite de memória
maxmemory-policy allkeys-lru

# Habilita persistência AOF (Append Only File)
# Garante recuperação consistente de dados após reinicializações
appendonly yes
appendfsync everysec
