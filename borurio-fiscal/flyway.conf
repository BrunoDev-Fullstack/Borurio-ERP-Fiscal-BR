# =============================================================================
# Flyway Configuration File - Borurio Fiscal (NF-e / SEFAZ / Auditoria)
# =============================================================================
# Ambiente: Desenvolvimento Local (Windows / PowerShell)
# Banco de Dados: MySQL 8.4 (Docker: porta 3307)
# Autor: Bruno Ribeiro (Desenvolvedor Java / DevSecOps)
# Data: 2025-10-13
# =============================================================================

# -----------------------------------------------------------------------------
# DRIVER JDBC
# -----------------------------------------------------------------------------
flyway.driver=com.mysql.cj.jdbc.Driver

# -----------------------------------------------------------------------------
# CONEXÃO COM O BANCO
# -----------------------------------------------------------------------------
flyway.url=jdbc:mysql://127.0.0.1:3307/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
flyway.user=borurio
flyway.password=H4ck3r123

# -----------------------------------------------------------------------------
# SCHEMA PRINCIPAL DO MÓDULO FISCAL
# -----------------------------------------------------------------------------
flyway.schemas=borurio_fiscal_dev

# -----------------------------------------------------------------------------
# LOCALIZAÇÃO DOS ARQUIVOS DE MIGRAÇÃO
# -----------------------------------------------------------------------------
# O caminho abaixo usa filesystem: para apontar diretamente para o diretório local
# onde estão os arquivos SQL (ex: V001__create_nfe_log.sql)
# -----------------------------------------------------------------------------
flyway.locations=filesystem:C:/Projetos/borurio-erp-br/borurio-fiscal/src/main/resources/db/migration

# -----------------------------------------------------------------------------
# COMPORTAMENTO DE MIGRAÇÃO
# -----------------------------------------------------------------------------
# baselineOnMigrate: cria a tabela flyway_schema_history se não existir
# validateOnMigrate: valida o checksum dos scripts já aplicados
# cleanDisabled: impede drop de schema acidental
# connectRetries: número de tentativas de conexão antes de falhar
# -----------------------------------------------------------------------------
flyway.baselineOnMigrate=true
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.connectRetries=3
flyway.connectRetriesInterval=5

# -----------------------------------------------------------------------------
# LOGS E SAÍDAS
# -----------------------------------------------------------------------------
# flyway.outputType=pretty   # (padrão)
# flyway.verbose=true        # ativa log detalhado opcionalmente
# -----------------------------------------------------------------------------

# =============================================================================
# Fim da configuração Flyway - Borurio Fiscal
# =============================================================================
