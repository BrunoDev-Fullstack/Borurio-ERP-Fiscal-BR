# =====================================================================
# Ambiente: Produção (PRD)
# Módulo: Borurio Fiscal (NF-e / SEFAZ / Auditoria)
# Autor: Bruno Ribeiro — Desenvolvedor Java / DevSecOps
# Data: 15/10/2025
# Versão: 1.0.1
# Compatibilidade: Spring Boot 3.3.x / Java 17 / UTF-8 (sem BOM)
# =====================================================================

spring:
  application:
    name: borurio-fiscal

  profiles:
    active: prd

  ######################################################################
  # BANCO DE DADOS – Produção
  ######################################################################
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST:borurio-mysql}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:borurio_fiscal}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: ${MYSQL_USER:borurio}
    password: ${MYSQL_PASSWORD:secure_pass_2025}
    hikari:
      pool-name: FiscalProdHikariPool
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:borurio-redis}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8

  jackson:
    serialization:
      INDENT_OUTPUT: true
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  mail:
    host: ${MAIL_HOST:borurio-mail}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USER:suporte@borurio.com.br}
    password: ${MAIL_PASS:secure_mail_pass}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
    default-encoding: UTF-8
    from: ${MAIL_FROM:notificacoes@borurio.com.br}

server:
  port: 8080
  error:
    include-message: never
  tomcat:
    max-threads: 200
    accesslog:
      enabled: true
      directory: /var/log/borurio
      prefix: access
      suffix: .log
      pattern: "%h %l %u %t \"%r\" %s %b"

logging:
  file:
    name: /var/log/borurio/borurio-fiscal-prd.log
  level:
    root: INFO
    org.springframework.web: WARN
    org.mybatis: INFO
    com.zaxxer.hikari: INFO
    br.com.borurio: INFO
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      file-name-pattern: /var/log/borurio/borurio-fiscal-prd.%d{yyyy-MM-dd}.log
      max-history: 15
      total-size-cap: 200MB

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when_authorized
  health:
    redis:
      enabled: true
    db:
      enabled: true

# =====================================================================
# Configurações do SEFAZ (Ambiente Real – Produção)
# =====================================================================
borurio:
  sefaz:
    environment: producao
    xml-path: /opt/borurio/xml/
    schema-path: /opt/borurio/xsd/
    endpoint-autorizacao: https://nfe.fazenda.sp.gov.br/ws/NFeAutorizacao4.asmx
    endpoint-retorno: https://nfe.fazenda.sp.gov.br/ws/NFeRetAutorizacao4.asmx
    endpoint-cancelamento: https://nfe.fazenda.sp.gov.br/ws/NFeCancelamento4.asmx
    endpoint-cce: https://nfe.fazenda.sp.gov.br/ws/RecepcaoEvento4.asmx
    certificate:
      enabled: true
      type: A1
      keystore: file:/opt/borurio/certs/certificado-a1.pfx
      password: ${CERT_PASSWORD:senha_certificado_prd}
      alias: borurio-prod
      storetype: PKCS12

# =====================================================================
# MINIO / STORAGE – XMLs e Logs Fiscais
# =====================================================================
minio:
  endpoint: ${MINIO_URL:http://borurio-minio:9000}
  access-key: ${MINIO_ROOT_USER:admin}
  secret-key: ${MINIO_ROOT_PASSWORD:admin123}
  bucket: borurio-fiscal
  secure: false

# =====================================================================
# Segurança e Boas Práticas
# =====================================================================
security:
  headers:
    frame-options: DENY
    xss-protection: 1; mode=block
    content-security-policy: "default-src 'self'"
  cors:
    allowed-origins: ["https://erp.borurio.com.br"]
    allowed-methods: [GET, POST, PUT, DELETE]
    allowed-headers: [Content-Type, Authorization]
    allow-credentials: true

# =====================================================================
# Notas Técnicas:
# - Ambiente de produção com logging em /var/log/borurio/
# - Certificado A1 ativo (PFX) para emissão real de NF-e.
# - Banco MySQL 8.4 / Redis 7.2 via Docker Compose PRD.
# - Variáveis sensíveis definidas via .env.prd (não versionadas).
# - Logs rotacionados automaticamente a cada 24h (15 dias de retenção).
# - Codificação forçada UTF-8 sem BOM.
# =====================================================================
