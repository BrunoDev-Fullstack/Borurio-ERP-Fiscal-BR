spring:
  application:
    name: borurio-fiscal

  profiles:
    active: dev

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
    username: borurio
    password: H4ck3r123
    hikari:
      pool-name: FiscalHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      timeout: 2000
      connect-timeout: 2000

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
    table: flyway_schema_history
    encoding: UTF-8

  jackson:
    serialization:
      INDENT_OUTPUT: true
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: 8081
  error:
    include-message: always
  tomcat:
    accesslog:
      enabled: true
      directory: logs
      prefix: access
      suffix: .log
      pattern: "%h %l %u %t \"%r\" %s %b"

logging:
  file:
    name: logs/borurio-fiscal-dev.log
  level:
    root: INFO
    org.springframework.web: INFO
    org.mybatis: INFO
    com.zaxxer.hikari: INFO
    br.com.borurio: DEBUG
  pattern:
    console: "%d{HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%thread] %logger{36} - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: always
  health:
    redis:
      enabled: true
    db:
      enabled: true

# =====================================================================
# Configurações do Mock SEFAZ-SP (modo desenvolvimento)
# =====================================================================
borurio:
  sefaz:
    environment: homologacao
    xml-path: C:/Projetos/borurio-erp-br/borurio-fiscal/src/test/resources/xml/
    schema-path: C:/Projetos/borurio-erp-br/borurio-fiscal/src/main/resources/xsd/
    endpoint-mock: http://localhost:8081/nfe/status
    certificate:
      enabled: false
      type: A1
      keystore: classpath:certs/certificado-a1.pfx
      password: senha_certificado

# =====================================================================
# Notas:
# - Logs são gravados em logs/borurio-fiscal-dev.log
# - Codificação forçada UTF-8
# - Mock SEFAZ utiliza schema-path local (xsd/) e XMLs simulados
# - Assinatura digital desabilitada no modo DEV (certificate.enabled=false)
# - Banco: MySQL 8.4 / Redis 7.2
# =====================================================================
