# ============================================================
# Flyway Configuration - Borurio ERP Fiscal BR (Ambiente DEV)
# ------------------------------------------------------------
# Responsável por gerenciar e versionar as migrações SQL do
# módulo Fiscal (NF-e / SEFAZ-SP / Auditoria Fiscal).
#
# Compatibilidade:
#   - Flyway 10.18.0
#   - MySQL 8.4.x (Docker)
#   - Java 17 / Spring Boot 3.3.x
# ------------------------------------------------------------
# Autor: Bruno Ribeiro — DevSecOps / Eng. de Software
# Data: 16/10/2025
# ============================================================

# ------------------------------------------------------------
# Conexão com o Banco de Dados (MySQL - container: borurio-mysql-dev)
# ------------------------------------------------------------
flyway.url=jdbc:mysql://127.0.0.1:3307/borurio_fiscal_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
flyway.user=borurio
flyway.password=H4ck3r123
flyway.schemas=borurio_fiscal_dev

# ------------------------------------------------------------
# Localização dos scripts de migração
# ------------------------------------------------------------
# IMPORTANTE: use filesystem: para execução via Maven/Flyway CLI
# use classpath: somente dentro do runtime do Spring Boot
# ------------------------------------------------------------
flyway.locations=filesystem:C:/Projetos/borurio-erp-br/borurio-fiscal/src/main/resources/db/migration

# ------------------------------------------------------------
# Convenções de nomenclatura
# ------------------------------------------------------------
flyway.sqlMigrationPrefix=V
flyway.sqlMigrationSeparator=__
flyway.sqlMigrationSuffixes=.sql

# ------------------------------------------------------------
# Comportamento e validações
# ------------------------------------------------------------
flyway.baselineOnMigrate=true
flyway.connectRetries=3
flyway.encoding=UTF-8
flyway.validateOnMigrate=true
flyway.cleanDisabled=true
flyway.mixed=false
flyway.outOfOrder=false

# ------------------------------------------------------------
# Tabela de histórico de migração
# ------------------------------------------------------------
flyway.table=flyway_schema_history

# ------------------------------------------------------------
# Logs e Diagnóstico
# ------------------------------------------------------------
# flyway.outputType=JSON       # (opcional para pipelines CI/CD)
# flyway.reportFilename=flyway-report.html
# flyway.reportEnabled=true

# ============================================================
# Fim do arquivo
# ============================================================
