# ==============================================================
# ARQUIVO: application-dev.yml
# MÓDULO: borurio-core
# DESCRIÇÃO:
#   Configurações globais do ambiente de desenvolvimento (DEV)
#   do sistema Borurio ERP Fiscal BR.
#   Este módulo fornece parâmetros de infraestrutura e codificação
#   comuns a todos os submódulos da aplicação.
# ==============================================================

spring:
  application:
    name: borurio-core

  # Configuração global de codificação e locale
  mvc:
    locale: pt_BR
    locale-resolver: fixed
    charset: UTF-8

  messages:
    encoding: UTF-8

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

  # ---------------------- Banco de Dados (MySQL via Docker) ----------------------
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3307/borurio_erp?useUnicode=true&characterEncoding=UTF-8&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root

  # ---------------------- Redis (Cache / Sessões) ----------------------
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 0
      timeout: 1500ms

  cache:
    type: redis

# =========================
# LOGGING GLOBAL
# =========================
logging:
  level:
    root: INFO
    org.springframework.web: INFO
  file:
    name: logs/borurio-core.log

# =========================
# INTEGRAÇÃO MINIO (armazenamento XML / DANFE / documentos)
# =========================
custom:
  oss:
    endpoint: http://localhost:9000
    access-key: minioadmin
    secret-key: minioadmin
    bucket: nfe-xml

# =========================
# E-MAIL (Mailpit - ambiente DEV)
# =========================
mail:
  host: localhost
  port: 2526
  username: ""
  password: ""
  properties:
    mail.smtp.auth: false
    mail.smtp.starttls.enable: false

# =========================
# APLICAÇÃO (Configurações diversas)
# =========================
app:
  timezone: America/Sao_Paulo
  scheduling:
    enable: false   # Desativado em DEV; habilitar apenas em PRD
